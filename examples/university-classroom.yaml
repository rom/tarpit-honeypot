# University teaching lab / classroom — a large honeynet of lab machines.
#
# A computer-science teaching lab presented as one big honeynet: an
# instructor station, a course/lab server, a coursework NAS, a lab printer,
# and ~24 student workstations split between a Windows lab (RDP/SMB) and a
# Linux lab (SSH), plus a few Raspberry-Pi networking-lab nodes and a
# lecture-hall capture device. Student lab subnets are noisy (people learn
# nmap here), so this is a good place to TUNE: keep the workstation surface
# realistic but trip on the things that aren't coursework — credential
# brute force, lateral movement, and a compromised box sweeping the lab or
# beaconing out.
#
# Put the instructor/admin VLAN in `allowlist` and, if your assignments
# include scanning, raise the `port_scan` / `host_sweep` thresholds.
#
#   tarpit-honeypot validate-config -c examples/university-classroom.yaml
sensor:
  name: cs-lab-decoy
  data_dir: /var/lib/tarpit-honeypot
  drop_user: tarpit
  drop_group: tarpit
  interfaces: [eth0]
  disk: { json_log_mb: 512, sqlite_mb: 2048, pcap_mb: 4096, retention_days: 120 }

ui:
  enabled: true
  bind: 127.0.0.1:8088

listeners:
  - { id: ssh,   proto: tcp, bind: 0.0.0.0:22,   mode: banner, handler: ssh,   severity: high,     capture: true }
  - { id: http,  proto: tcp, bind: 0.0.0.0:80,   mode: banner, handler: http,  severity: medium,   capture: true }
  - { id: https, proto: tcp, bind: 0.0.0.0:443,  mode: banner, handler: https, severity: medium,   capture: true }
  - { id: smb,   proto: tcp, bind: 0.0.0.0:445,  mode: banner, handler: smb,   severity: high,     capture: true }
  - { id: rdp,   proto: tcp, bind: 0.0.0.0:3389, mode: banner, handler: rdp,   severity: high,     capture: true }
  - { id: pjl,   proto: tcp, bind: 0.0.0.0:9100, mode: banner, handler: pjl,   severity: medium,   capture: true }
  - { id: ipp,   proto: tcp, bind: 0.0.0.0:631,  mode: banner, handler: ipp,   severity: medium }
  - { id: nas-http,  proto: tcp, bind: 0.0.0.0:5000, mode: banner, handler: http,  severity: medium }
  - { id: nas-https, proto: tcp, bind: 0.0.0.0:5001, mode: banner, handler: https, severity: medium }
  - { id: mysql, proto: tcp, bind: 0.0.0.0:3306, mode: banner, handler: mysql, severity: high,     capture: true }
  - { id: snmp,  proto: udp, bind: 0.0.0.0:161,  mode: banner, handler: snmp,  severity: low }

honeynets:
  - id: cs-lab-204
    cidr: 10.30.0.0/16
    gateway: 10.30.0.1
    dns: 10.30.0.2
    domain: lab.univ.example
    arp_responder:  { enabled: true, interface: eth0 }
    icmp_responder: { enabled: true, interface: eth0 }
    hosts:
      # --- Lab infrastructure (10.30.0.x) ---
      - { ip: 10.30.0.10, hostname: instructor-ws, os: windows, archetype: windows-11,   services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      - { ip: 10.30.0.11, hostname: lab-server,    os: linux,   archetype: ubuntu-24.04, services: [ {port: 22, handler: ssh}, {port: 80, handler: http}, {port: 443, handler: https}, {port: 3306, handler: mysql} ] }
      - { ip: 10.30.0.12, hostname: coursework-nas, archetype: synology-dsm,             services: [ {port: 5000, handler: http}, {port: 5001, handler: https}, {port: 445, handler: smb} ] }
      - { ip: 10.30.0.13, hostname: lab-printer,    archetype: hp-printer,               services: [ {port: 9100, handler: pjl}, {port: 631, handler: ipp}, {port: 161, handler: snmp} ] }
      - { ip: 10.30.0.14, hostname: capture-av,     archetype: axis-camera,              services: [ {port: 80, handler: http} ] }
      # --- Windows lab row A (10.30.1.x) — RDP + SMB. ---
      - { ip: 10.30.1.1,  hostname: winlab-a01, os: windows, archetype: windows-10, services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      - { ip: 10.30.1.2,  hostname: winlab-a02, os: windows, archetype: windows-10, services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      - { ip: 10.30.1.3,  hostname: winlab-a03, os: windows, archetype: windows-10, services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      - { ip: 10.30.1.4,  hostname: winlab-a04, os: windows, archetype: windows-10, services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      - { ip: 10.30.1.5,  hostname: winlab-a05, os: windows, archetype: windows-10, services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      - { ip: 10.30.1.6,  hostname: winlab-a06, os: windows, archetype: windows-10, services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      - { ip: 10.30.1.7,  hostname: winlab-a07, os: windows, archetype: windows-11, services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      - { ip: 10.30.1.8,  hostname: winlab-a08, os: windows, archetype: windows-11, services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      - { ip: 10.30.1.9,  hostname: winlab-a09, os: windows, archetype: windows-11, services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      - { ip: 10.30.1.10, hostname: winlab-a10, os: windows, archetype: windows-11, services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      - { ip: 10.30.1.11, hostname: winlab-a11, os: windows, archetype: windows-10, services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      - { ip: 10.30.1.12, hostname: winlab-a12, os: windows, archetype: windows-10, services: [ {port: 3389, handler: rdp}, {port: 445, handler: smb} ] }
      # --- Linux lab row B (10.30.2.x) — SSH. ---
      - { ip: 10.30.2.1,  hostname: nixlab-b01, os: linux, archetype: ubuntu-24.04, services: [ {port: 22, handler: ssh} ] }
      - { ip: 10.30.2.2,  hostname: nixlab-b02, os: linux, archetype: ubuntu-24.04, services: [ {port: 22, handler: ssh} ] }
      - { ip: 10.30.2.3,  hostname: nixlab-b03, os: linux, archetype: ubuntu-24.04, services: [ {port: 22, handler: ssh} ] }
      - { ip: 10.30.2.4,  hostname: nixlab-b04, os: linux, archetype: ubuntu-24.04, services: [ {port: 22, handler: ssh} ] }
      - { ip: 10.30.2.5,  hostname: nixlab-b05, os: linux, archetype: ubuntu-24.04, services: [ {port: 22, handler: ssh} ] }
      - { ip: 10.30.2.6,  hostname: nixlab-b06, os: linux, archetype: ubuntu-24.04, services: [ {port: 22, handler: ssh} ] }
      - { ip: 10.30.2.7,  hostname: nixlab-b07, os: linux, archetype: debian-12,    services: [ {port: 22, handler: ssh} ] }
      - { ip: 10.30.2.8,  hostname: nixlab-b08, os: linux, archetype: debian-12,    services: [ {port: 22, handler: ssh} ] }
      - { ip: 10.30.2.9,  hostname: nixlab-b09, os: linux, archetype: debian-12,    services: [ {port: 22, handler: ssh} ] }
      - { ip: 10.30.2.10, hostname: nixlab-b10, os: linux, archetype: debian-12,    services: [ {port: 22, handler: ssh} ] }
      - { ip: 10.30.2.11, hostname: nixlab-b11, os: linux, archetype: rocky-9,      services: [ {port: 22, handler: ssh} ] }
      - { ip: 10.30.2.12, hostname: nixlab-b12, os: linux, archetype: rocky-9,      services: [ {port: 22, handler: ssh} ] }
      # --- Networking-lab Raspberry-Pi nodes (10.30.3.x). ---
      - { ip: 10.30.3.1,  hostname: pi-net-01, os: linux, archetype: debian-12, services: [ {port: 22, handler: ssh}, {port: 80, handler: http} ] }
      - { ip: 10.30.3.2,  hostname: pi-net-02, os: linux, archetype: debian-12, services: [ {port: 22, handler: ssh}, {port: 80, handler: http} ] }
      - { ip: 10.30.3.3,  hostname: pi-net-03, os: linux, archetype: arch-linux, services: [ {port: 22, handler: ssh} ] }

correlate:
  port_scan:        { enabled: true, distinct_ports: 8,  window: 30s,  severity: medium }
  brute_force:      { enabled: true, attempts: 10,       window: 60s,  per_port: true, severity: high }
  host_sweep:       { enabled: true, distinct_hosts: 15, window: 60s,  severity: high }
  lateral_movement: { enabled: true, severity: high }
  beacon:           { enabled: true, severity: high }
  slow_scan:        { enabled: true, distinct_ports: 12, window: 24h,  severity: medium }

devices:
  enabled: true
  learn: true
  severity: low

interaction:
  mode: low

allowlist:
  - 10.30.250.0/24      # instructor / lab-admin VLAN

channels:
  - { id: stdout,  type: stdout,  min_severity: low }
  - { id: jsonlog, type: jsonlog, min_severity: low }
  - { id: sqlite,  type: sqlite,  min_severity: low }

routes:
  - { match: { severity: ">=low" }, channels: [jsonlog, sqlite, stdout] }
