# Edge decoy — Teltonika RUT240 industrial LTE router.
#
# Teltonika RUT-series routers are everywhere in industrial/remote sites
# (cellular backhaul for OT). This decoy presents the RutOS fingerprint:
# Dropbear SSH, lighttpd web UI, Teltonika SNMP identity. Good for an OT
# remote-site segment where a real RUT240 would live.
#
#   tarpit-honeypot validate-config -c examples/edge/teltonika-rut240.yaml
sensor:
  name: rut240-site-decoy
  data_dir: /var/lib/tarpit
  archetype: teltonika-rut240
  drop_user: tarpit
  drop_group: tarpit
  disk: { json_log_mb: 128, sqlite_mb: 512, pcap_mb: 1024, capture_kb: 64, retention_days: 180 }

ui:
  enabled: true
  bind: 127.0.0.1:8088

listeners:
  - { id: ssh,   proto: tcp, bind: 0.0.0.0:22,  mode: banner, handler: ssh,   severity: high, capture: true }
  - { id: http,  proto: tcp, bind: 0.0.0.0:80,  mode: banner, handler: http,  severity: medium }
  - { id: https, proto: tcp, bind: 0.0.0.0:443, mode: banner, handler: https, severity: medium }
  - { id: snmp,  proto: udp, bind: 0.0.0.0:161, mode: banner, handler: snmp,  severity: medium }

correlate:
  port_scan:   { enabled: true, distinct_ports: 5, window: 30s, severity: high }
  brute_force: { enabled: true, attempts: 8,       window: 60s, severity: high }

channels:
  - { id: stdout,  type: stdout,  min_severity: low }
  - { id: jsonlog, type: jsonlog, min_severity: low }
  - { id: sqlite,  type: sqlite,  min_severity: low }
