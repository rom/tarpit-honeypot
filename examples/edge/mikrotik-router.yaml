# Edge decoy — MikroTik RouterOS router.
#
# MikroTik gear is among the most-attacked edge hardware on the internet
# (Winbox CVEs, default creds, botnet recruitment). This decoy presents a
# believable RouterOS fingerprint: ROSSSH, webfig, Winbox/API ports, and
# the RouterOS CLI emulator on SSH/Telnet so a botnet's login attempts are
# captured.
#
#   tarpit-honeypot validate-config -c examples/edge/mikrotik-router.yaml
sensor:
  name: mikrotik-edge-decoy
  data_dir: /var/lib/tarpit
  # Enrichment — canonical paths (run-safe: missing files are skipped, so
  # this validates/runs as-is). Populate with scripts/fetch-enrichment.sh +
  # scripts/install-enrichment.sh on the sensor, then SIGHUP. Feeds GeoIP /
  # ASN / threat-intel / Tor / MAC-vendor tags + the threat_intel_burst and
  # geo_velocity correlators.
  oui_file: /etc/tarpit-honeypot/enrichment/oui.csv
  net_class: { enabled: true }
  geoip: { city_db: /etc/tarpit-honeypot/enrichment/geoip/city.mmdb, asn_db: /etc/tarpit-honeypot/enrichment/geoip/asn.mmdb }
  tor: { enabled: true, exit_file: /etc/tarpit-honeypot/enrichment/tor-exits.txt }
  threat_intel:
    enabled: true
    lists:
      - { label: firehol-level1, file: /etc/tarpit-honeypot/enrichment/threat/firehol-level1.txt }
      - { label: blocklist-de,   file: /etc/tarpit-honeypot/enrichment/threat/blocklist-de.txt }
  archetype: mikrotik-router
  drop_user: tarpit
  drop_group: tarpit
  session_recording: { enabled: true }
  disk: { json_log_mb: 128, sqlite_mb: 512, pcap_mb: 1024, capture_kb: 64, retention_days: 180 }

ui:
  enabled: true
  bind: 127.0.0.1:8088

listeners:
  - { id: ssh,    proto: tcp, bind: 0.0.0.0:22,   mode: banner, handler: ssh_interactive, severity: high, capture: true }
  - { id: telnet, proto: tcp, bind: 0.0.0.0:23,   mode: banner, handler: telnet,          severity: high, capture: true }
  - { id: webfig, proto: tcp, bind: 0.0.0.0:80,   mode: banner, handler: http,            severity: medium }
  - { id: ftp,    proto: tcp, bind: 0.0.0.0:21,   mode: banner, handler: ftp,             severity: medium }
  - { id: winbox, proto: tcp, bind: 0.0.0.0:8291, mode: drop, handler: raw,              severity: high }
  - { id: api,    proto: tcp, bind: 0.0.0.0:8728, mode: drop, handler: raw,              severity: high }
  - { id: snmp,   proto: udp, bind: 0.0.0.0:161,  mode: banner, handler: snmp,            severity: medium }

correlate:
  port_scan:   { enabled: true, distinct_ports: 5,  window: 30s,  severity: high }
  brute_force: { enabled: true, attempts: 8,        window: 60s,  severity: high }

channels:
  - { id: stdout,  type: stdout,  min_severity: low }
  - { id: jsonlog, type: jsonlog, min_severity: low }
  - { id: sqlite,  type: sqlite,  min_severity: low }
