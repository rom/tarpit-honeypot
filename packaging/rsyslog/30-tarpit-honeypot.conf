# rsyslog drop-in for tarpit-honeypot — installed to /etc/rsyslog.d/.
#
# Keeps the sensor's own logs out of /var/log/messages and in a dedicated file
# under /var/log/tarpit-honeypot/. This matches BOTH sources the sensor emits
# under the "tarpit-honeypot" syslog identity:
#
#   * the tool's operational logs (startup messages, warnings, errors) — slog
#     writes them to stderr, systemd's journald tags them with the unit's
#     SyslogIdentifier=tarpit-honeypot and (with ForwardToSyslog) hands them to
#     rsyslog; and
#   * the CEF event stream from the `syslog` channel, whose sink sets the same
#     syslog tag (config: channels[].tag: tarpit-honeypot).
#
# Both arrive with $programname == "tarpit-honeypot", so one rule captures them.
# `stop` ends processing for these messages so they do NOT also fall through to
# the catch-all that writes /var/log/messages (RHEL) or /var/log/syslog (Debian).
#
# To relay events onward to a SIEM, prefer pointing the `syslog` channel at the
# collector directly (network: udp|tcp, address: HOST:514) rather than tailing
# this file. RainerScript syntax below works on rsyslog 7+ (all current distros).
#
# The target file is pre-created by scripts/install.sh with ownership the local
# rsyslog daemon can write to (root writes directly on RHEL/SUSE/Arch; the
# 'syslog' user it drops to on Debian/Ubuntu is granted access there), so this
# rule does not set fileOwner/fileGroup — chowning would need CAP_CHOWN that the
# dropped daemon lacks. fileCreateMode only applies if the file is absent.

if ($programname == 'tarpit-honeypot') then {
    action(type="omfile"
           file="/var/log/tarpit-honeypot/tarpit-honeypot.log"
           fileCreateMode="0640")
    stop
}
