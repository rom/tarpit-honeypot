  # ---- resolving DNS (fabricated answers) ----
  # Answers A/AAAA/MX/TXT/NS/CNAME with deterministic-per-deployment
  # fake records so a resolver-enumeration sees a live, populated server.
  # Every query runs through tunneling/exfil detection.
  - id: udp-dns
    proto: udp
    bind: 0.0.0.0:20076
    mode: banner
    handler: dns
    severity: medium
    read_timeout: 10s

  # ---- emulate-then-tarpit ----
  # Runs the protocol handler first (real SSH banner + captured request),
  # THEN holds the connection in the tarpit. Any emulator becomes a tarpit.
  - id: tcp-ssh-tarpit
    proto: tcp
    bind: 0.0.0.0:20077
    mode: tarpit
    handler: ssh
    severity: high
    read_timeout: 10s
    tarpit:
      strategy: sticky
      max_per_source: 4
      max_total: 256
      emulate: true

  # Lua dynamic-response service: the script drives the connection with
  # per-host personality, deterministic randomness, timers, and persistent
  # per-source state. See configs/scripts/iot-login.lua.
  - id: tcp-lua-iot
    proto: tcp
    bind: 0.0.0.0:20078
    mode: banner
    handler: lua
    script: configs/scripts/iot-login.lua
    severity: medium
    read_timeout: 30s

  # Declarative fake protocol (no Lua): a fake memcached text service. Rules
  # are matched top-down per client message; first match wins. Text fields
  # support \r \n \t \0 \xHH \\ escapes; use *_hex for binary. TCP-only.
  - id: tcp-scripted-memcached
    proto: tcp
    bind: 0.0.0.0:11211
    mode: banner
    handler: scripted
    severity: medium
    read_timeout: 30s
    read_bytes: 4096
    scripted:
      max_rounds: 16
      rules:
        - match: prefix
          value: "version"
          respond: "VERSION 1.6.21\r\n"
        - match: prefix
          value: "stats"
          respond: "STAT pid 2098\r\nSTAT version 1.6.21\r\nSTAT curr_connections 10\r\nEND\r\n"
        - match: prefix
          value: "get "
          respond: "END\r\n"          # key miss
        - match: prefix
          value: "set "
          anomaly: "memcached-write-attempt"
          respond: "STORED\r\n"
        - match: contains
          value: "flush_all"
          anomaly: "memcached-flush-attempt"
          respond: "OK\r\n"
        - match: contains
          value: "gets "             # CAS reads — common scraping pattern
          respond: "END\r\n"
      default: "ERROR\r\n"


canaries:
  - id: shared-creds
    path: ./var/canary/passwords.xlsx
    events: [write, remove, rename, chmod]
    severity: critical

url_canaries:
  - id: aws-backup
    path: /backup/aws-prod.tar.gz
    severity: critical

dns:
  enabled: true
  bind: 0.0.0.0:5354
  amplifier_detection:
    enabled: true
    window: 60s
    queries: 20
    severity: high

dns_canaries:
  - id: prod-cdb
    name: prod-cdb-x7q.canary.example.com
    severity: critical

sniffer:
  enabled: true
  interface: eth0
  severity: high
  arp_scan: { distinct_ips: 16, window: 30s }
  # Packet-capture scan-detection layer (L3/L4). Catches TCP scans that
  # never establish a session — closed-port SYN floods, ACK scans, and
  # NULL/FIN/Xmas stealth probes the kernel silently drops. Needs
  # CAP_NET_RAW (same as the ARP sniffer). Emits sniffer:tcp_*_scan.
  tcp_scan:
    enabled: true
    distinct_ports: 16     # SYN/ACK volume threshold per source/window
    stealth_ports: 3       # NULL/FIN/Xmas threshold (lower — always hostile)
    window: 30s
    detect_fragments: true # flag fragmented inbound probes (evasion)

correlate:
  port_scan:   { enabled: true, distinct_ports: 5, window: 30s, severity: high }
  brute_force: { enabled: true, attempts: 10, window: 60s, severity: high }
  slow_scan:   { enabled: true, distinct_ports: 10, window: 24h, severity: high }
  icmp_sweep:  { enabled: true, distinct_ips: 10, window: 30s, severity: high }
  # Password spraying: one source trying many DISTINCT usernames (the
  # breadth signal — the inverse of brute_force's depth).
  password_spray:   { enabled: true, distinct_users: 5, window: 300s, severity: high }
  # Credential reuse: the same user+pass tried from many DISTINCT sources
  # (a shared credential list / botnet — credential stuffing).
  credential_reuse: { enabled: true, distinct_sources: 3, window: 1h, severity: high }

devices:
  enabled: true
  learn: true
  severity: high
  allow:
    - 127.0.0.1
    - ::1

# Per-source decaying threat score. Every event adds severity/category-
# weighted points to its source; the score halves over `half_life` of
# silence. Crossing a threshold emits risk:elevated / risk:high /
# risk:critical, and the top scorers surface in the web UI (/risk).
risk:
  enabled: true
  half_life: 1h
  elevated: 30
  high: 75
  critical: 150

honeynets:
  - id: corp
    cidr: 10.99.0.0/24
    gateway: 10.99.0.1
    dns: 10.99.0.2
    domain: corp.example.local
    arp_responder:  { enabled: true, interface: eth0 }
    icmp_responder: { enabled: true, interface: eth0 }
    lldp_responder: { enabled: true, interface: eth0, interval_s: 30, include_cdp: true }
    # Answer PROFINET-DCP Identify (L2, EtherType 0x8892) for industrial
    # hosts so a PROFINET scan enumerates the cell; raises
    # honeynet:profinet_dcp_identify on every probe. Linux + CAP_NET_RAW.
    profinet_responder: { enabled: true, interface: eth0, severity: high }
    tun:            { enabled: false, device: "", mtu: 1500 }
    hosts:
      - ip: 10.99.0.10
        hostname: web-prod-01
        os: linux
        archetype: ubuntu 24.04 lts
        services:
          - { port: 22,  handler: ssh }
          - { port: 80,  handler: http }
          - { port: 443, handler: https }
      - ip: 10.99.0.20
        hostname: dc-01
        os: windows
        # Active Directory DC archetype: PowerShell shell + the full AD
        # protocol mix + a pre-2021-rollup patch level (ZeroLogon /
        # PrintNightmare / ProxyLogon advisory).
        archetype: active directory
        services:
          - { port: 53,   handler: dns }
          - { port: 88,   handler: kerberos }
          - { port: 135,  handler: dcerpc }
          - { port: 389,  handler: ldap }
          - { port: 445,  handler: smb }
          - { port: 3268, handler: ldap }     # Global Catalog
          - { port: 3389, handler: rdp }
          - { port: 5985, handler: winrm }
      - ip: 10.99.0.30
        hostname: plc-01
        os: ics
        archetype: siemens s7-1500
        services:
          - { port: 102, handler: s7 }
          - { port: 80,  handler: http }
      - ip: 10.99.0.40
        hostname: sw-core-01
        os: cisco
        # Cisco IOS switch: routes the shell to the Cisco CLI emulator
        # (enable + show version/run/vlan/cdp).
        archetype: cisco-ios
        services:
          - { port: 22,  handler: ssh }
          - { port: 23,  handler: telnet }
          - { port: 161, handler: snmp }

dedup:
  default_window: 5m

allowlist:
  - 127.0.0.1/32
  - ::1/128

channels:
  - id: console
    type: stdout
  - id: db
    type: sqlite
  - id: log
    type: jsonlog
  - id: cef-syslog
    type: syslog
    network: udp
    address: 127.0.0.1:5514
    format: cef
  - id: leef-syslog
    type: syslog
    network: udp
    address: 127.0.0.1:5515
    format: leef
  - id: webhook
    type: webhook
    url: https://example.invalid/hook
    hmac_secret_env: TARPIT_WEBHOOK_SECRET
    min_severity: high
  - id: mqtt-out
    type: mqtt
    url: tcp://127.0.0.1:1883
    topic: tarpit/events
    qos: 1

routes:
  - match: {}
    channels: [db, log]
  - match: { severity: ">=high" }
    channels: [console, cef-syslog, leef-syslog, webhook, mqtt-out]
