  # ---- resolving DNS (fabricated answers) ----
  # Answers A/AAAA/MX/TXT/NS/CNAME with deterministic-per-deployment
  # fake records so a resolver-enumeration sees a live, populated server.
  # Every query runs through tunneling/exfil detection.
  - id: udp-dns
    proto: udp
    bind: 0.0.0.0:20076
    mode: banner
    handler: dns
    severity: medium
    read_timeout: 10s

  # ---- emulate-then-tarpit ----
  # Runs the protocol handler first (real SSH banner + captured request),
  # THEN holds the connection in the tarpit. Any emulator becomes a tarpit.
  - id: tcp-ssh-tarpit
    proto: tcp
    bind: 0.0.0.0:20077
    mode: tarpit
    handler: ssh
    severity: high
    read_timeout: 10s
    tarpit:
      strategy: sticky
      max_per_source: 4
      max_total: 256
      emulate: true

  # Lua dynamic-response service: the script drives the connection with
  # per-host personality, deterministic randomness, timers, and persistent
  # per-source state. See configs/scripts/iot-login.lua.
  - id: tcp-lua-iot
    proto: tcp
    bind: 0.0.0.0:20078
    mode: banner
    handler: lua
    script: configs/scripts/iot-login.lua
    severity: medium
    read_timeout: 30s

  # Declarative fake protocol (no Lua): a fake memcached text service. Rules
  # are matched top-down per client message; first match wins. Text fields
  # support \r \n \t \0 \xHH \\ escapes; use *_hex for binary. TCP-only.
  - id: tcp-scripted-memcached
    proto: tcp
    bind: 0.0.0.0:11211
    mode: banner
    handler: scripted
    severity: medium
    read_timeout: 30s
    read_bytes: 4096
    scripted:
      max_rounds: 16
      rules:
        - match: prefix
          value: "version"
          respond: "VERSION 1.6.21\r\n"
        - match: prefix
          value: "stats"
          respond: "STAT pid 2098\r\nSTAT version 1.6.21\r\nSTAT curr_connections 10\r\nEND\r\n"
        - match: prefix
          value: "get "
          respond: "END\r\n"          # key miss
        - match: prefix
          value: "set "
          anomaly: "memcached-write-attempt"
          respond: "STORED\r\n"
        - match: contains
          value: "flush_all"
          anomaly: "memcached-flush-attempt"
          respond: "OK\r\n"
        - match: contains
          value: "gets "             # CAS reads — common scraping pattern
          respond: "END\r\n"
      default: "ERROR\r\n"

  # TLS-terminating MITM front (handler: tls_intercept). Terminates TLS with a
  # believable self-signed cert (JA3/JA4 + JA3S computed like `https`), then
  # routes the *decrypted* stream one of two ways:
  #
  # (A) inner_handler — a TLS front for an emulated service. Here we present
  #     the redis handler over TLS on a non-standard port: the attacker speaks
  #     RESP inside a TLS tunnel and we capture AUTH creds in cleartext.
  - id: tcp-tls-front-redis
    proto: tcp
    bind: 0.0.0.0:20090
    mode: banner
    handler: tls_intercept
    severity: medium
    read_timeout: 30s
    tls_intercept:
      inner_handler: redis
  #
  # (B) forward_to — a true decrypt-and-forward MITM to a REAL backend. The
  #     cleartext attacker<->service session is captured (client->backend bytes,
  #     64 KB cap). DANGER/opt-in: the backend MUST be in the egress allowlist
  #     or the sensor fails closed (forward_err) — it can never become an open
  #     proxy. forward_tls re-encrypts to the backend (TLS-to-TLS). Uncomment
  #     and point at a backend you operate; it is auto-allowlisted at startup.
  # - id: tcp-tls-forward
  #   proto: tcp
  #   bind: 0.0.0.0:20091
  #   mode: banner
  #   handler: tls_intercept
  #   severity: high
  #   read_timeout: 30s
  #   tls_intercept:
  #     forward_to: 10.0.0.20:443
  #     forward_tls: true

  # Dynamic Lua services (counters / timestamps / uptime / rotating banners).
  # See configs/scripts/*.lua. Each script drives the socket directly.
  - id: tcp-lua-redis
    proto: tcp
    bind: 0.0.0.0:20083
    mode: banner
    handler: lua
    script: configs/scripts/redis-mini.lua
    severity: medium
    read_timeout: 30s
  - id: tcp-lua-smtp
    proto: tcp
    bind: 0.0.0.0:20084
    mode: banner
    handler: lua
    script: configs/scripts/smtp-greeting.lua
    severity: low
    read_timeout: 30s

  # Full fake-vulnerable web application. Works on http or https (set
  # handler: https + an https: block to serve it over TLS). Detects — never
  # executes — SQLi / XSS / LFI / RFI / SSRF / cmdi / SSTI / Log4Shell etc.
  - id: tcp-webapp
    proto: tcp
    bind: 0.0.0.0:20085
    mode: banner
    handler: http
    webapp: true
    severity: high
    read_timeout: 20s
    read_bytes: 16384
    capture: true

  # ---- AI / agentic-attack decoys ----
  # The agentic honeypot recognizes A2A / AP2 / MCP / ACP agent traffic and
  # feeds counter-exfil breadcrumbs; the LLM / Ollama / MCP decoys emulate the
  # exposed inference + tool servers that agent frameworks probe for. These use
  # their canonical real-world ports (none collide with the 2000x bank above).
  - id: tcp-agent
    proto: tcp
    bind: 0.0.0.0:8080           # agentic provocateur (A2A/AP2/MCP/ACP)
    mode: banner
    handler: agent
    severity: high
    read_timeout: 30s
    read_bytes: 16384
  - id: tcp-ollama
    proto: tcp
    bind: 0.0.0.0:11434          # Ollama inference-server decoy
    mode: banner
    handler: ollama
    severity: medium
    read_timeout: 15s
    read_bytes: 8192
  - id: tcp-llm-openai
    proto: tcp
    bind: 0.0.0.0:8081           # OpenAI-style /v1 LLM API decoy
    mode: banner
    handler: llm_openai
    severity: medium
    read_timeout: 15s
    read_bytes: 8192
  - id: tcp-mcp
    proto: tcp
    bind: 0.0.0.0:8000           # Model Context Protocol (MCP) server decoy
    mode: banner
    handler: mcp
    severity: medium
    read_timeout: 15s
    read_bytes: 8192
  # Fake C2 team-server: recognizes beacon / stager check-ins. Canonical C2
  # ports are 8080 (taken above by the agent decoy) or 80 — we use 80 here.
  - id: tcp-c2-emulator
    proto: tcp
    bind: 0.0.0.0:80             # fake C2 team-server (beacon/stager recognition)
    mode: banner
    handler: c2_emulator
    severity: high
    read_timeout: 15s
    read_bytes: 16384

  # ---- Additional OT / ICS protocols ----
  - id: tcp-bacnet-sc
    proto: tcp
    bind: 0.0.0.0:47808          # BACnet Secure Connect (WS+TLS BMS data link)
    mode: banner
    handler: bacnet_sc
    severity: critical
    read_timeout: 10s
  - id: tcp-mbus
    proto: tcp
    bind: 0.0.0.0:10001          # M-Bus meter gateway
    mode: banner
    handler: mbus
    severity: high
    read_timeout: 10s
  - id: tcp-dlms
    proto: tcp
    bind: 0.0.0.0:4059           # DLMS/COSEM smart-metering
    mode: banner
    handler: dlms
    severity: high
    read_timeout: 10s
  - id: tcp-osisoft-pi
    proto: tcp
    bind: 0.0.0.0:5450           # OSIsoft PI historian
    mode: banner
    handler: osisoft_pi
    severity: high
    read_timeout: 10s
  - id: tcp-fox
    proto: tcp
    bind: 0.0.0.0:1911           # Niagara / Tridium Fox (BMS)
    mode: banner
    handler: fox
    severity: high
    read_timeout: 10s
  - id: tcp-iccp-secure
    proto: tcp
    bind: 0.0.0.0:3782           # Secure ICCP / TASE.2 (inter-control-center)
    mode: banner
    handler: iccp_secure
    severity: critical
    read_timeout: 10s


canaries:
  - id: shared-creds
    path: ./var/canary/passwords.xlsx
    events: [write, remove, rename, chmod]
    severity: critical

url_canaries:
  - id: aws-backup
    path: /backup/aws-prod.tar.gz
    severity: critical

dns:
  enabled: true
  bind: 0.0.0.0:5354
  amplifier_detection:
    enabled: true
    window: 60s
    queries: 20
    severity: high

dns_canaries:
  - id: prod-cdb
    name: prod-cdb-x7q.canary.example.com
    severity: critical

sniffer:
  enabled: true
  interface: eth0
  severity: high
  arp_scan: { distinct_ips: 16, window: 30s }
  # Packet-capture scan-detection layer (L3/L4). Catches TCP scans that
  # never establish a session — closed-port SYN floods, ACK scans, and
  # NULL/FIN/Xmas stealth probes the kernel silently drops. Needs
  # CAP_NET_RAW (same as the ARP sniffer). Emits sniffer:tcp_*_scan.
  tcp_scan:
    enabled: true
    distinct_ports: 16     # SYN/ACK volume threshold per source/window
    stealth_ports: 3       # NULL/FIN/Xmas threshold (lower — always hostile)
    window: 30s
    detect_fragments: true # flag fragmented inbound probes (evasion)

# External threat-intel feed ingestion. Each feed URL must be reachable under
# the egress allowlist (it's auto-allowlisted when threat_feeds is enabled). A
# matched source IP is tagged external_intel + threat_intel_hit, so the risk
# scorer, tarpits, severity overrides, and the blocklist all act on it.
threat_feeds:
  enabled: false
  poll: 1h
  feeds:
    - { label: firehol, url: "https://iplists.firehol.org/files/firehol_level1.netset", format: lines }
    # - { label: abuseipdb, url: "https://api.abuseipdb.com/api/v2/blacklist", format: json_ips, header: "Key: ${ABUSEIPDB_KEY}" }

# CISA Known Exploited Vulnerabilities (KEV) auto-sync. When enabled the sensor
# pulls the KEV catalog on `poll` and stamps every cve:<id> event whose CVE is
# KEV-listed with kev=true + kev_date_added + kev_known_ransomware, lifting its
# severity to at least High. The feed host (www.cisa.gov) is fetched through the
# egress-governed client, so add it to egress.allow when egress is enabled. Use
# `file:` for the offline / air-gapped path (scripts/fetch-kev.sh installs it).
kev:
  enabled: false
  # url: ""                    # empty = the authoritative CISA KEV JSON feed
  poll: 6h
  # header: "Name: value"      # optional request header (e.g. a proxy token)
  # file: /etc/tarpit-honeypot/kev/known_exploited_vulnerabilities.json

# Malware detonation / intel loop: captured sample hashes are looked up on
# VirusTotal (and, only when you opt into uploading, detonated in a CAPE
# sandbox); the verdict (AV ratio, family) and the network IOCs it yields
# (contacted domains/IPs/URLs, dropped-file hashes) re-enter the pipeline as
# `malware:detonation` events and flow into the IOC store + TAXII/MISP export.
# Outbound goes through the egress policy; keys are read from env-var NAMES.
detonation:
  enabled: false
  vt_api_key_env: VT_API_KEY   # env var holding the VirusTotal API key
  requests_per_min: 4          # VirusTotal free-tier cap
  # cache_ttl: 24h
  # workers: 2
  # submit_samples: false      # UPLOAD unknown samples to CAPE (can go public — off by default)
  # cape_url: "https://cape.internal"
  # cape_token_env: CAPE_TOKEN
  # cape_poll_every: 10s
  # cape_max_wait: 3m
  # max_sample_mb: 32

correlate:
  port_scan:   { enabled: true, distinct_ports: 5, window: 30s, severity: high }
  brute_force: { enabled: true, attempts: 10, window: 60s, severity: high }
  slow_scan:   { enabled: true, distinct_ports: 10, window: 24h, severity: high }
  icmp_sweep:  { enabled: true, distinct_ips: 10, window: 30s, severity: high }
  # Password spraying: one source trying many DISTINCT usernames (the
  # breadth signal — the inverse of brute_force's depth).
  password_spray:   { enabled: true, distinct_users: 5, window: 300s, severity: high }
  # Credential reuse: the same user+pass tried from many DISTINCT sources
  # (a shared credential list / botnet — credential stuffing).
  credential_reuse: { enabled: true, distinct_sources: 3, window: 1h, severity: high }
  # HTTP dirbusting, DNS name enumeration, and C2 beaconing.
  path_enumeration: { enabled: true, distinct_paths: 50, window: 60s, severity: high }
  dns_enumeration:  { enabled: true, distinct_names: 50, window: 60s, severity: medium }
  beacon:           { enabled: true, min_hits: 6, max_jitter_pct: 20, window: 1h, severity: high }
  # Additional opt-in correlators (default-off; shown here enabled).
  # host_sweep: horizontal scan — one source touching many honeynet hosts.
  host_sweep:        { enabled: true, distinct_hosts: 10, window: 60s, severity: high }
  # cross_target: one source reaching several of THIS host's server IPs — records
  # the order, timing and per-target ports, and the ports hit on >1 target (a
  # scripted same-service sweep across the fleet). For multi-IP / multi-instance
  # deployments. Lower distinct_targets than host_sweep since there are few IPs.
  cross_target:      { enabled: true, distinct_targets: 2, window: 300s, severity: high }
  # service_sweep: cross-protocol recon — many distinct service handlers.
  service_sweep:     { enabled: true, distinct_services: 5, window: 60s, severity: medium }
  # ua_rotation: one source cycling many distinct HTTP User-Agents (evasion).
  ua_rotation:       { enabled: true, distinct_agents: 4, window: 300s, severity: medium }
  # exploit_chain: one source attempting many DISTINCT CVEs (mass-exploit).
  exploit_chain:     { enabled: true, distinct_cves: 2, window: 600s, severity: critical }
  # ics_control: repeated OT write/control commands (modbus/bacnet/...).
  ics_control:       { enabled: true, attempts: 3, window: 300s, severity: critical }
  # canary_trip: one source tripping many distinct canary tokens/honeyfiles.
  canary_trip:       { enabled: true, distinct_tokens: 2, window: 1h, severity: critical }
  # fingerprint_reuse: one JA3/JA4/HASSH fingerprint across many source IPs.
  fingerprint_reuse: { enabled: true, distinct_sources: 5, window: 1h, severity: medium }
  # protocol_violation: one source tripping many distinct anomaly markers.
  protocol_violation: { enabled: true, distinct_anomalies: 5, window: 300s, severity: medium }
  # exfil: cumulative inbound bytes from one source crossing a threshold.
  exfil:             { enabled: true, bytes: 1048576, window: 300s, severity: high }
  # session_flood: volumetric connection flood from one source.
  session_flood:     { enabled: true, connections: 200, window: 60s, severity: medium }

# Interaction depth. This "everything ON" reference uses medium_experimental
# so the experimental capture knobs are unlocked (still best-effort — see
# `tarpit-honeypot list-unavailable-capabilities`). Most deployments want low.
interaction:
  mode: medium_experimental
  http2_probe_capture: headers_only
  ssh_kex_depth: extended_experimental
  browser_traps: off

devices:
  enabled: true
  learn: true
  severity: high
  allow:
    - 127.0.0.1
    - ::1

# Per-source decaying threat score. Every event adds severity/category-
# weighted points to its source; the score halves over `half_life` of
# silence. Crossing a threshold emits risk:elevated / risk:high /
# risk:critical, and the top scorers surface in the web UI (/risk).
risk:
  enabled: true
  half_life: 1h
  elevated: 30
  high: 75
  critical: 150
  # Active-response backstop (opt-in, Linux + nft + CAP_NET_ADMIN). When a
  # source crosses `level`, drop it at the host firewall for `ttl`, then let
  # the kernel expire it. A honeypot's value is observation, so blocking ends
  # the engagement — leave this off unless you want active inbound mitigation.
  block:
    enabled: false
    level: critical          # elevated | high | critical
    ttl: 15m                 # nftables set-element timeout
    never_block: []          # extra IPs/CIDRs exempt (loopback+link-local always are)
    # table: tarpit_blocklist

honeynets:
  - id: corp
    cidr: 10.99.0.0/24
    gateway: 10.99.0.1
    dns: 10.99.0.2
    domain: corp.example.local
    arp_responder:  { enabled: true, interface: eth0 }
    icmp_responder: { enabled: true, interface: eth0 }
    lldp_responder: { enabled: true, interface: eth0, interval_s: 30, include_cdp: true }
    # Answer PROFINET-DCP Identify (L2, EtherType 0x8892) for industrial
    # hosts so a PROFINET scan enumerates the cell; raises
    # honeynet:profinet_dcp_identify on every probe. Linux + CAP_NET_RAW.
    profinet_responder: { enabled: true, interface: eth0, severity: high }
    tun:            { enabled: false, device: "", mtu: 1500 }
    hosts:
      - ip: 10.99.0.10
        hostname: web-prod-01
        os: linux
        archetype: ubuntu 24.04 lts
        services:
          - { port: 22,  handler: ssh }
          - { port: 80,  handler: http }
          - { port: 443, handler: https }
      - ip: 10.99.0.20
        hostname: dc-01
        os: windows
        # Active Directory DC archetype: PowerShell shell + the full AD
        # protocol mix + a pre-2021-rollup patch level (ZeroLogon /
        # PrintNightmare / ProxyLogon advisory).
        archetype: active directory
        services:
          - { port: 53,   handler: dns }
          - { port: 88,   handler: kerberos }
          - { port: 135,  handler: dcerpc }
          - { port: 389,  handler: ldap }
          - { port: 445,  handler: smb }
          - { port: 3268, handler: ldap }     # Global Catalog
          - { port: 3389, handler: rdp }
          - { port: 5985, handler: winrm }
      - ip: 10.99.0.30
        hostname: plc-01
        os: ics
        archetype: siemens s7-1500
        services:
          - { port: 102, handler: s7 }
          - { port: 80,  handler: http }
      - ip: 10.99.0.40
        hostname: sw-core-01
        os: cisco
        # Cisco IOS switch: routes the shell to the Cisco CLI emulator
        # (enable + show version/run/vlan/cdp).
        archetype: cisco-ios
        services:
          - { port: 22,  handler: ssh }
          - { port: 23,  handler: telnet }
          - { port: 161, handler: snmp }

dedup:
  default_window: 5m

allowlist:
  - 127.0.0.1/32
  - ::1/128

channels:
  - id: console
    type: stdout
  - id: db
    type: sqlite
  - id: log
    type: jsonlog
  - id: cef-syslog
    type: syslog
    network: udp
    address: 127.0.0.1:5514
    format: cef
  - id: leef-syslog
    type: syslog
    network: udp
    address: 127.0.0.1:5515
    format: leef
  # The outbound channels below need external infra (a broker, a SIEM
  # collector, a secret/URL in an env var) so they ship `enabled: false`
  # and are skipped at startup. Set `enabled: true` (and provide the env
  # vars / endpoints) to turn one on.
  - id: webhook
    type: webhook
    enabled: false
    url: https://example.invalid/hook
    hmac_secret_env: TARPIT_WEBHOOK_SECRET
    min_severity: high
  - id: mqtt-out
    type: mqtt
    enabled: false         # needs an MQTT broker on tcp://127.0.0.1:1883
    url: tcp://127.0.0.1:1883
    topic: tarpit/events
    qos: 1
  - id: mqtt-tls
    type: mqtt
    enabled: false
    url: tls://broker.example:8883
    topic: tarpit/events
    qos: 1
    username_env: TARPIT_MQTT_USER
    password_env: TARPIT_MQTT_PASS
    # ca_cert_file: /etc/tarpit-honeypot/broker-ca.pem
    min_severity: high
  - id: syslog-tls
    type: syslog
    enabled: false
    network: tls           # RFC 5424 + octet-counting over TLS (RFC 5425)
    address: siem.example:6514
    format: cef
    # ca_cert_file: /etc/tarpit-honeypot/siem-ca.pem
    # tls_insecure: true   # lab collectors with self-signed certs only
    min_severity: medium
  - id: discord
    type: discord
    enabled: false
    url_env: TARPIT_DISCORD_WEBHOOK   # the Discord incoming-webhook URL
    min_severity: high

routes:
  - match: {}
    channels: [db, log]
  - match: { severity: ">=high" }
    channels: [console, cef-syslog, leef-syslog, webhook, mqtt-out, discord]
