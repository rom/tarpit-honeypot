# tarpit-honeypot — FULL example: every handler + every feature ON.
#
# This config is a reference / smoke-test artifact: it binds ONE
# listener per protocol handler (TCP + UDP) on sequential high ports
# starting at 20000 (so nothing collides), and turns on every
# detection + intelligence subsystem. It is NOT a recommended
# production layout — use the standard example.yaml or the OT examples
# for real deployments. Validate it with:
#   tarpit-honeypot validate-config -c tarpit-honeypot.example-FULL.yaml
#
# ⚠ TO SEE EVENTS, SCAN THE BOUND PORTS, NOT 22/80/443. Every service here
# is REMAPPED to ports 20000-20085 (plus 515/5354/9100/11211), so a scan of
# the standard ports hits nothing and you'll only see sensor:* lifecycle
# events. Generate traffic with e.g.:
#   nmap -p 20000-20085,515,9100 <host>
#   nc 127.0.0.1 20001        # the ssh listener
# Run `tarpit-honeypot show-config -c <this file> | grep -E 'id:|bind:'` for
# the id->port map. For a "scan it on real ports (22/80/443/...)" demo, use
# configs/tarpit-honeypot.example.yaml instead.
#
# Generated listener block below covers all 47 TCP + 17 UDP handlers.

sensor:
  name: full-example-sensor
  data_dir: ./var
  archetype: debian 12
  jitter:    { enabled: true, min_ms: 5, max_ms: 50 }
  tls_rotate: { days: 30 }
  shutdown:  { drain_timeout: 10s }
  # Vulnerable-banner / fake-patch-level emulation. When on, banner-aware
  # handlers advertise the archetype's deliberately-unpatched version
  # (e.g. debian 12 -> Apache 2.4.49 / OpenSSH 7.2 / vsFTPd 2.3.4) so a
  # version scanner records an exploitable box. The service is NEVER
  # actually exploitable. CVE exploit-attempt detection (cve:<id> events)
  # runs regardless of this flag. Override per-listener with vuln_emulation.
  vuln_emulation: true
  # Operational alarms. sensor:started/stopped + sensor:health (disk +
  # sink drops) are always on; first_seen + digest are opt-in here.
  alerts:
    first_seen: true          # source:first_seen on a source's first >= medium event
    digest_interval: 24h      # sensor:digest summary every 24h (0 = off)
    disk_warn_percent: 90     # sensor:health when data_dir crosses this
  # Malware / shellcode / payload harvesting to <data_dir>/payloads/.
  # Captured artifacts (uploaded binaries, base64 droppers, shellcode) are
  # classified + persisted; ingress URLs are harvested. Collection only.
  payloads:
    enabled: true
    max_bytes: 1048576      # 1 MiB per artifact (pushed uploads / shellcode)
    max_total_mb: 256       # directory cap, oldest-first rotation
    # Opt-in: actively DOWNLOAD ingress-tool URLs an attacker tried to pull
    # (e.g. "wget http://evil/x") and store the real artifact. The fetch dials
    # through the egress allowlist, so it can only reach destinations you
    # explicitly permit (point it at a dedicated analysis egress). Off by
    # default — it makes the sensor initiate outbound connections.
    fetch_urls: false
    fetch_max_bytes: 16777216   # 16 MiB cap per active download
  # Kernel self-confinement (Linux), applied after privilege drop. seccomp
  # denies shell-spawn / module-load / debug syscalls; landlock makes the
  # filesystem read-only except data_dir. Best-effort; see docs/hardening.md.
  sandbox:
    seccomp: true
    landlock: true
  disk:
    json_log_mb: 500
    sqlite_mb: 500
    pcap_mb: 1024
    capture_kb: 64
    retention_days: 30
  geoip:
    city_db: ""
    asn_db:  ""
  rdns:
    enabled: false
    timeout: 500ms
    cache_size: 1024
  # Threat-intel tagging: tag source IPs found on operator-supplied
  # reputation lists (one IP/CIDR per line; '#' comments allowed). Each
  # list's label lands in the event's threat_intel meta. Enrichment only.
  threat_intel:
    enabled: false
    lists:
      - { label: abuse-ch,    file: /etc/tarpit-honeypot/intel/abuse-ch.txt }
      - { label: blocklist-de, file: /etc/tarpit-honeypot/intel/blocklist-de.txt }
  # Tor-exit tagging: flag sources in an operator-supplied exit-node list
  # (tor_exit=true on the event).
  tor:
    enabled: false
    exit_file: /etc/tarpit-honeypot/intel/tor-exits.txt
  # Network classification (no external DB): tag public sources "bogon"
  # (reserved/martian range) or "hosting" (datacenter/cloud AS-org, when
  # the GeoIP ASN db is loaded).
  net_class:
    enabled: true
  # MAC-vendor (OUI) database for mapping observed MACs to vendors. Unset =
  # a small built-in table. Fetch the full IEEE DB with
  # scripts/fetch-enrichment.sh.
  oui_file: ""   # e.g. /etc/tarpit-honeypot/enrichment/oui.csv

ui:
  enabled: true
  bind: 127.0.0.1:8088
  # auth_token_env: TARPIT_UI_TOKEN
  # Opt the otherwise read-only UI into device delete/whitelist actions on
  # the devices tab. Requires auth_token_env to also be set; off by default.
  # allow_device_actions: true

