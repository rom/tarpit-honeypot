# Harvested-secret & post-exploitation detection rules (detection-as-code).
#
# These turn the high-signal markers the sensor now raises — the attacker's OWN
# leaked secrets (internal/secretscan), completed Redis drop chains, SMTP
# phishing/malware content, and RDP username harvesting — into tunable,
# severity-raising detections with ATT&CK tags. They complement the built-in
# anomaly markers and the CVE catalog.
#
#   ATT&CK: T1552 unsecured credentials, T1078 valid accounts,
#   T1505.003 web shell, T1566 phishing, T1021 remote services.

# --- The attacker leaked their OWN credentials/secrets to the decoy -----------
- id: harvest-operator-secret
  title: Attacker leaked a secret of their own into a request
  description: >
    internal/secretscan recovered an API key, token, JWT, cookie, private key,
    certificate or DB URI from what the attacker sent — high-value operator
    attribution (and, for a live credential, actionable).
  severity: high
  tags: [custom:operator-secret-leak, attack.t1552]
  match:
    anomaly|prefix: "secret:"

- id: harvest-private-key
  title: Attacker leaked a PEM private key
  severity: critical
  tags: [custom:operator-private-key, attack.t1552.004]
  match:
    anomaly: secret:private-key

- id: harvest-cloud-key
  title: Attacker leaked a cloud / vendor API key
  severity: critical
  tags: [custom:operator-cloud-key, attack.t1552.001]
  match:
    anomaly:
      - secret:aws-access-key
      - secret:aws-secret-key
      - secret:google-api-key
      - secret:google-oauth
      - secret:anthropic-key
      - secret:openai-key
      - secret:github-token
      - secret:github-pat
      - secret:gitlab-pat
      - secret:stripe-key

- id: harvest-db-uri
  title: Attacker leaked a DB connection string with embedded credentials
  severity: high
  tags: [custom:operator-db-uri, attack.t1552.001]
  match:
    anomaly: secret:db-uri

# --- Completed server-side drop chains ----------------------------------------
- id: redis-drop-chain-complete
  title: Redis webshell/cron/SSH-key drop chain completed
  description: CONFIG SET dir/dbfilename followed by SET payload + SAVE.
  severity: critical
  tags: [custom:redis-rce, attack.t1505.003]
  match:
    anomaly: redis-drop-chain-complete

- id: redis-payload-staged
  title: Redis staged a drop payload (webshell / SSH key / cron)
  severity: high
  tags: [custom:redis-payload, attack.t1505.003]
  match:
    anomaly: redis-payload-staged

# --- Mail content -------------------------------------------------------------
- id: smtp-phishing-content
  title: SMTP message carrying a credential-lure link
  severity: high
  tags: [custom:phishing, attack.t1566.002]
  match:
    anomaly: smtp-phishing-content

- id: smtp-malware-attachment
  title: SMTP message carrying a (base64) attachment
  severity: high
  tags: [custom:mail-attachment, attack.t1566.001]
  match:
    anomaly: smtp-attachment

# --- Remote-access credential reconnaissance ----------------------------------
- id: rdp-username-harvest
  title: RDP mstshash cookie reveals the targeted account
  severity: medium
  tags: [custom:rdp-username, attack.t1078]
  match:
    anomaly: rdp-username-harvest

- id: ssh-oversized-password
  title: SSH oversized (>256 byte) password — *sshole / auth-bypass probe
  severity: high
  tags: [custom:ssh-oversized, attack.t1190]
  match:
    anomaly:
      - ssh-oversized-password
      - ssh-sshole-attempt

# --- First-try decoy logins (the deception worked) ----------------------------
- id: decoy-login-accepted
  title: Attacker was accepted into an interactive decoy
  description: accept_creds / credential_list granted the attacker a shell.
  severity: high
  tags: [custom:decoy-login, attack.t1078]
  match:
    meta.accepted_user|exists: "true"

# --- Cleartext credentials over an unencrypted channel ------------------------
- id: cleartext-credentials
  title: Cleartext credential capture on a plaintext service
  severity: medium
  tags: [custom:cleartext-cred, attack.t1040]
  match:
    handler: [telnet, ftp, http, pop3, imap, smtp_recv, redis, snmp]
    anomaly:
      - default-credential-attempt
      - telnet-mirai-credential
