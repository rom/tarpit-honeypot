# Credential-access detection rules (detection-as-code).
#
# Fire on credential theft, brute force, and honeytoken use across every
# service the sensor speaks. These match on the credential-capture meta keys
# the handlers populate (auth_user / auth_pass / username / ntlm_user /
# ntlmv2_hash / bearer_token), so most are deliberately handler-agnostic — they
# fire wherever the field appears.
#
#   Drop in detection.rules_dir, reload with SIGHUP, check with validate-config.
#   ATT&CK: T1078 valid accounts, T1110 brute force, T1187 forced auth,
#   T1528 steal app access token, T1552 unsecured credentials.

- id: cred-honeytoken-login
  title: Honeytoken account used to log in
  description: >
    A credential planted by the web-deception layer (security.txt / robots /
    sitemap contacts) was replayed against a login on any protocol. Nobody
    legitimately knows these accounts, so a hit is unambiguous prior recon +
    credential use.
  severity: critical
  tags: [custom:honeytoken-login, attack.t1078]
  match:
    anomaly: honeytoken:account-login

- id: cred-privileged-login
  title: Privileged username submitted to a decoy service
  description: A login for a high-value account name on any auth-bearing handler.
  severity: high
  tags: [custom:privileged-login, attack.t1110]
  match:
    meta.auth_user|re: "(?i)^(root|admin|administrator|sa|oracle|postgres|sysadmin|operator|enable)$"

- id: cred-privileged-login-web
  title: Privileged username on a web / app login
  description: Same as cred-privileged-login but for handlers that record `username`.
  severity: high
  tags: [custom:privileged-login, attack.t1110]
  match:
    meta.username|re: "(?i)^(root|admin|administrator|sa|sysadmin|superuser)$"

- id: cred-telnet-root-login
  title: Telnet root/admin login attempt
  severity: high
  tags: [custom:privileged-login, attack.t1110]
  match:
    handler: telnet
    meta.user_attempt|re: "(?i)^(root|admin|administrator|enable)$"

- id: cred-weak-password
  title: Well-known weak / default password submitted
  description: A textbook weak or vendor-default password on any service.
  severity: high
  tags: [custom:weak-password, attack.t1110.001]
  match:
    meta.auth_pass|re: "(?i)^(admin|password|passw0rd|123456|1234|root|toor|changeme|letmein|default|public|private|guest|cisco|raspberry)$"

- id: cred-ntlm-hash-captured
  title: Net-NTLMv2 response captured (offline-crackable)
  description: An SMB / RDP-NLA / WinRM exchange leaked a crackable net-NTLMv2 hash.
  severity: high
  tags: [custom:ntlm-hash, attack.t1187]
  match:
    meta.ntlmv2_hash|exists: true

- id: cred-cloud-metadata-theft
  title: Cloud instance-metadata credential path probed (IMDS SSRF)
  description: >
    Access to the 169.254.169.254 IAM/credentials path — the classic SSRF →
    cloud-credential-theft pivot.
  severity: critical
  tags: [custom:imds-creds, attack.t1552.005]
  match:
    meta.path|re: "(?i)(iam/security-credentials|metadata/identity|computemetadata|latest/meta-data|metadata\\.google)"

- id: cred-bearer-token-captured
  title: Bearer / API token presented to a decoy
  description: "An Authorization: Bearer / service-account token sent to a honeypot."
  severity: medium
  tags: [custom:token-captured, attack.t1528]
  match:
    meta.bearer_token|exists: true
