# Archeservice role bundles: each expands into the right listeners for
# the role, combined with an archetype for correct software/banners.
# Bound to dedicated loopback IPs so their real ports don't collide.
archeservices:
  - id: svc-webserver
    role: webserver
    archetype: debian 12
    bind: 127.0.1.1
    severity: high
  - id: svc-ftpserver
    role: ftpserver
    archetype: ubuntu 24.04 lts
    bind: 127.0.1.2
    severity: high
  - id: svc-sshserver
    role: sshserver
    archetype: rhel 9
    bind: 127.0.1.3
    severity: high
  - id: svc-printserver
    role: printserver
    archetype: hp-printer
    bind: 127.0.1.4
    severity: high
  - id: svc-fileserver
    role: fileserver
    archetype: windows server 2019
    bind: 127.0.1.5
    severity: high
  - id: svc-ldapserver
    role: ldapserver
    archetype: active-directory
    bind: 127.0.1.6
    severity: high
  - id: svc-adserver
    role: adserver
    archetype: active-directory
    bind: 127.0.1.7
    severity: high
  - id: svc-mailserver
    role: mailserver
    archetype: debian 12
    bind: 127.0.1.8
    severity: high
  - id: svc-dbserver
    role: dbserver
    archetype: debian 12
    bind: 127.0.1.9
    severity: high
  - id: svc-dnsserver
    role: dnsserver
    archetype: debian 12
    bind: 127.0.1.10
    severity: high
  - id: svc-snmpserver
    role: snmpserver
    archetype: cisco-catalyst-9300
    bind: 127.0.1.11
    severity: high
  - id: svc-voipserver
    role: voipserver
    archetype: asterisk-voip
    bind: 127.0.1.12
    severity: high
  - id: svc-remoteaccess
    role: remoteaccess
    archetype: windows server 2019
    bind: 127.0.1.13
    severity: high

sniffer:
  enabled: false   # set true on Linux with CAP_NET_RAW for L2 scan detection
  arp_scan: { enabled: false }
  tcp_scan: { enabled: false, detect_fragments: true }
  goose: { enabled: false }

correlate:
  port_scan: { enabled: true }
  brute_force: { enabled: true }
  slow_scan: { enabled: true }
  password_spray: { enabled: true }
  credential_reuse: { enabled: true }
  icmp_sweep: { enabled: true }
  path_enumeration: { enabled: true }
  dns_enumeration: { enabled: true }
  beacon: { enabled: true }
  storyline: { enabled: true }

# Low-interaction by default across the estate.
interaction:
  mode: low

devices:
  enabled: true
  learn: true
  severity: high

risk:
  enabled: true
  half_life: 1h
  elevated: 20
  high: 50
  critical: 100

dns:
  amplifier_detection: { enabled: true }

channels:
  - { id: console, type: stdout }
  - { id: db, type: sqlite }

routes:
  - { match: { severity: ">=low" }, channels: [console, db] }
