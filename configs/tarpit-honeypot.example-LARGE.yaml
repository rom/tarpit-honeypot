# tarpit-honeypot — LARGE example: every protocol handler enabled, plus
# the archeservice role bundles and all detection subsystems. This is a
# stress / reference config (validate with `tarpit-honeypot validate-config`);
# in production bind only the services you actually want exposed.
#
# Generated to exercise the full handler matrix. Ports are remapped into
# the 10000+/12000+ ranges so it runs without privileged ports or
# colliding with the archeservices below (which use real ports on
# dedicated loopback IPs).
#
# ⚠ TO SEE EVENTS, SCAN THE BOUND PORTS, NOT 22/80/443. The explicit
# listeners are on 10000+ (TCP) / 12000+ (UDP); the archeservices use real
# ports on 127.0.1.x. A scan of the standard ports hits nothing and you'll
# see only sensor:* lifecycle events. `show-config | grep -E 'id:|bind:'`
# lists the id->port map; use example.yaml for a real-port scan demo.

sensor:
  name: tarpit-large
  deployment_id: large-ref-01
  data_dir: /var/lib/tarpit-honeypot
  # Enrichment databases — fetch with scripts/fetch-enrichment.sh, install
  # with scripts/install-enrichment.sh. Empty/disabled here so it runs as-is;
  # set the paths + enabled once the DBs are in place.
  oui_file: ""                        # MAC->vendor ("" = built-in table)
  net_class: { enabled: true }        # bogon / cloud-hosting (no DB)
  geoip: { city_db: "", asn_db: "" }  # MaxMind / DB-IP .mmdb paths
  tor: { enabled: false, exit_file: /etc/tarpit-honeypot/enrichment/tor-exits.txt }
  threat_intel:
    enabled: false
    lists:
      - { label: firehol-level1, file: /etc/tarpit-honeypot/enrichment/threat/firehol-level1.txt }
  archetype: debian 12
  vuln_emulation: true
  jitter: { enabled: true, min_ms: 5, max_ms: 40 }
  session_recording: { enabled: true }

ui:
  enabled: true
  bind: 127.0.0.1:8088

