sensor:
  name: ""                                  # blank = hostname
  data_dir: ./var
  # Stable random seed used to derive per-deployment unique values
  # (SSH banner version, SMB challenge bytes, fake device serials, etc).
  # Blank = auto-generate on first run and persist to <data_dir>/.deployment-id.
  deployment_id: ""
  # On Linux, after privileged setup the sensor will switch to this user/group.
  # Use with systemd AmbientCapabilities=CAP_NET_BIND_SERVICE to keep
  # privileged ports working. Leave blank when running unprivileged anyway.
  drop_user: ""
  drop_group: ""
  # Randomized response delay on every handler reply. Defeats
  # microsecond-identical-latency scanner fingerprints.
  jitter:
    enabled: true
    min_ms: 5
    max_ms: 50
  # Auto-rotate the self-signed HTTPS cert older than this many days. 0 = never.
  tls_rotate:
    days: 30
  # Wait at most this long for in-flight handler goroutines to finish
  # on SIGTERM before force-cancelling them.
  shutdown:
    drain_timeout: 10s
  disk:
    json_log_mb: 500
    sqlite_mb: 500
    pcap_mb: 1024       # total cap for the captures directory
    capture_kb: 64      # per-session cap before truncation
    retention_days: 0   # 0 = no time-based retention; otherwise events / files / db rows older than this are pruned hourly
  # Source-IP enrichment. Each event's meta gets geo_country / geo_city /
  # asn / asn_org / rdns when configured. Loopback + RFC 1918 / RFC 4193
  # private sources are not enriched. The .mmdb files must be supplied by
  # the operator (MaxMind GeoLite2 license restricts redistribution).
  geoip:
    city_db: ""          # e.g. /var/lib/GeoLite2-City.mmdb
    asn_db:  ""          # e.g. /var/lib/GeoLite2-ASN.mmdb
  rdns:
    enabled: false
    timeout: 500ms       # bounded so a stalled resolver can't back up the bus
    cache_size: 1024     # LRU cache size

ui:
  enabled: true
  bind: 127.0.0.1:8088
  # Non-loopback binds REQUIRE both tls_cert+tls_key AND auth_token_env.
  # tls_cert: /etc/tarpit-honeypot/ui.crt
  # tls_key:  /etc/tarpit-honeypot/ui.key
  # auth_token_env: TARPIT_UI_TOKEN

listeners:
  - id: ssh-bait
    proto: tcp
    bind: 0.0.0.0:2222
    mode: banner
    handler: ssh
    severity: high
    read_bytes: 1024
    read_timeout: 5s
    capture: true

  - id: modbus-bait
    proto: tcp
    bind: 0.0.0.0:502
    mode: banner
    handler: modbus
    severity: critical
    read_bytes: 260
    read_timeout: 5s
    capture: true

  - id: s7-bait
    proto: tcp
    bind: 0.0.0.0:102
    mode: banner
    handler: s7
    severity: critical
    read_bytes: 256
    read_timeout: 5s
    capture: true

  - id: iec104-bait
    proto: tcp
    bind: 0.0.0.0:2404
    mode: banner
    handler: iec104
    severity: critical
    read_bytes: 256
    read_timeout: 5s

  - id: mqtt-bait
    proto: tcp
    bind: 0.0.0.0:1883
    mode: banner
    handler: mqtt
    severity: high
    read_bytes: 1024
    read_timeout: 5s

  - id: http-bait
    proto: tcp
    bind: 0.0.0.0:8000
    mode: banner
    handler: http
    severity: medium
    read_bytes: 4096
    read_timeout: 5s

  - id: https-bait
    proto: tcp
    bind: 0.0.0.0:8443
    mode: banner
    handler: https
    severity: high
    read_bytes: 4096
    read_timeout: 5s
    https:
      hosts: ["honeypot.local"]

  - id: telnet-tarpit
    proto: tcp
    bind: 0.0.0.0:2323
    mode: tarpit
    severity: high
    tarpit:
      strategy: sticky
      max_per_source: 4
      max_total: 256

  - id: ftp-bait
    proto: tcp
    bind: 0.0.0.0:2121
    mode: banner
    handler: ftp
    severity: medium
    read_bytes: 256
    read_timeout: 10s

  - id: udp-5353
    proto: udp
    bind: 0.0.0.0:5353
    mode: drop
    severity: low
    read_bytes: 1500

  - id: snmp-bait
    proto: udp
    bind: 0.0.0.0:161
    mode: banner
    handler: snmp
    severity: high
    read_bytes: 1500

  - id: ntp-bait
    proto: udp
    bind: 0.0.0.0:123
    mode: banner
    handler: ntp
    severity: medium
    read_bytes: 64

  - id: opcua-bait
    proto: tcp
    bind: 0.0.0.0:4840
    mode: banner
    handler: opcua
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: enip-bait
    proto: tcp
    bind: 0.0.0.0:44818
    mode: banner
    handler: ethernetip
    severity: critical
    read_bytes: 1024
    read_timeout: 5s

  - id: smb-bait
    proto: tcp
    bind: 0.0.0.0:445
    mode: banner
    handler: smb
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: vnc-bait
    proto: tcp
    bind: 0.0.0.0:5900
    mode: banner
    handler: vnc
    severity: high
    read_timeout: 5s

  - id: smtp25-bait
    proto: tcp
    bind: 0.0.0.0:25
    mode: banner
    handler: smtp_recv
    severity: high
    read_timeout: 15s

  - id: rdp-bait
    proto: tcp
    bind: 0.0.0.0:3389
    mode: banner
    handler: rdp
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: winrm-bait
    proto: tcp
    bind: 0.0.0.0:5985
    mode: banner
    handler: winrm
    severity: high
    read_bytes: 8192
    read_timeout: 5s

  - id: dcerpc-bait
    proto: tcp
    bind: 0.0.0.0:135
    mode: banner
    handler: dcerpc
    severity: high
    read_bytes: 4096
    read_timeout: 5s

  - id: ldap-bait
    proto: tcp
    bind: 0.0.0.0:389
    mode: banner
    handler: ldap
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: kerberos-bait
    proto: tcp
    bind: 0.0.0.0:88
    mode: banner
    handler: kerberos
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: postgres-bait
    proto: tcp
    bind: 0.0.0.0:5432
    mode: banner
    handler: postgres
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: mysql-bait
    proto: tcp
    bind: 0.0.0.0:3306
    mode: banner
    handler: mysql
