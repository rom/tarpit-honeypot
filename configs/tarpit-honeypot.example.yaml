# tarpit-honeypot — annotated reference config (canonical default values).
#
# Sibling examples in this directory:
#   tarpit-honeypot.example-MINIMAL.yaml                smallest useful deployment
#   tarpit-honeypot.example-FULL.yaml                   every handler + feature ON
#   tarpit-honeypot.example-LARGE.yaml                  big multi-segment estate
#   tarpit-honeypot.example-AD-ENTERPRISE.yaml          Windows / Active Directory decoy
#   tarpit-honeypot.example-DATASTORES-WEB.yaml         web app + Redis/Mongo/ES/memcached
#   tarpit-honeypot.example-LOW-INTERACTION-STRICT.yaml interaction guardrails pinned low
#   tarpit-honeypot.example-SMALL-OT.yaml               one small industrial cell
#   tarpit-honeypot.example-ADVANCED-OT.yaml            multi-cell plant (DMZ + 3 cells)
#   tarpit-honeypot.example-archeservices.yaml          role bundles (webserver, adserver, …)
#
# Validate any of them with:
#   tarpit-honeypot validate-config -c <file>

sensor:
  name: ""                                  # blank = hostname
  data_dir: ./var
  # Stable random seed used to derive per-deployment unique values
  # (SSH banner version, SMB challenge bytes, fake device serials, etc).
  # Blank = auto-generate on first run and persist to <data_dir>/.deployment-id.
  deployment_id: ""
  # OS-shaped banner profile. When set, SSH / HTTP(S) / FTP / Telnet /
  # SMTP / MySQL handlers report banners consistent with a stock install
  # of this distribution, so a scanner can't catch the sensor by spotting
  # version-vs-distro mismatches.
  #
  # `tarpit-honeypot help archetypes` lists the 259 valid names.
  # Per-listener and per-honeynet-host overrides take precedence.
  # Blank = fall back to the deployment-id-keyed variant pool.
  archetype: ""                              # e.g. "debian 12", "ubuntu 24.04 lts"
  # On Linux, after privileged setup the sensor will switch to this user/group.
  # Use with systemd AmbientCapabilities=CAP_NET_BIND_SERVICE to keep
  # privileged ports working. Leave blank when running unprivileged anyway.
  drop_user: ""
  drop_group: ""
  # In-process self-confinement (Linux). Enabled here because a honeypot is a
  # prime pivot target; both layers degrade gracefully (log a warning and keep
  # running) on kernels/platforms that don't support them, so leaving them on is
  # safe. They complement — not replace — the systemd unit / AppArmor / SELinux.
  sandbox:
    # seccomp: BPF syscall DENYLIST — blocks execve/ptrace/module-load/mount/
    # kexec/bpf/etc. (applied to every thread via TSYNC). Stops a handler bug
    # from spawning a shell or loading a kernel module.
    seccomp: true
    # landlock: make the filesystem read-only except data_dir (+ write_paths).
    landlock: true
    # Extra paths beyond "/" (read) and data_dir (write); usually unnecessary.
    read_paths: []
    write_paths: []
  # Randomized response delay on every handler reply. Defeats
  # microsecond-identical-latency scanner fingerprints.
  jitter:
    enabled: true
    min_ms: 5
    max_ms: 50
  # Auto-rotate the self-signed HTTPS cert older than this many days. 0 = never.
  tls_rotate:
    days: 30
  # Wait at most this long for in-flight handler goroutines to finish
  # on SIGTERM before force-cancelling them.
  shutdown:
    drain_timeout: 10s
  disk:
    json_log_mb: 500
    sqlite_mb: 500
    pcap_mb: 1024       # total cap for the captures directory
    capture_kb: 64      # per-session cap before truncation
    retention_days: 0   # 0 = no time-based retention; otherwise events / files / db rows older than this are pruned hourly
  # Source-IP / event enrichment. Each event's meta gets geo_country /
  # geo_city / asn / asn_org / rdns / mac_vendor / threat_intel / tor_exit /
  # net_class when configured. Loopback + RFC 1918 / RFC 4193 private sources
  # are not geo/rdns-enriched.
  #
  # The database FILES below are operator-supplied. They're best-effort: a
  # configured path that doesn't exist yet is logged and skipped (the sensor
  # still starts), so you can declare the canonical paths now, then populate
  # them later and SIGHUP to apply — no restart, no config edit:
  #   1) on an internet host:  scripts/fetch-enrichment.sh /tmp/enrichment-data
  #   2) copy the bundle to the sensor, then:
  #      sudo scripts/install-enrichment.sh /tmp/enrichment-data -c <this file>
  # `tarpit-honeypot list-paths -c <this file>` shows every path + present/MISSING.
  geoip:
    city_db: /etc/tarpit-honeypot/enrichment/geoip/city.mmdb
    asn_db:  /etc/tarpit-honeypot/enrichment/geoip/asn.mmdb
  rdns:
    enabled: false
    timeout: 500ms       # bounded so a stalled resolver can't back up the bus
    cache_size: 1024     # LRU cache size
  # MAC-vendor (OUI) database: maps observed MACs (DHCP/ARP) to vendors and
  # tags events with mac_vendor. Unset = small built-in table.
  oui_file: /etc/tarpit-honeypot/enrichment/oui.csv
  # Built-in (no DB) classification of public sources: bogon / cloud-hosting.
  net_class:
    enabled: true
  # Tag source IPs that appear in a Tor exit-node list (tor_exit=true).
  tor:
    enabled: true
    exit_file: /etc/tarpit-honeypot/enrichment/tor-exits.txt
  # Tag source IPs found on operator-supplied reputation lists (one IP/CIDR
  # per line; '#' comments allowed). Each list's label lands in threat_intel.
  # Labels match the file names scripts/fetch-enrichment.sh writes.
  threat_intel:
    enabled: true
    lists:
      - { label: firehol-level1, file: /etc/tarpit-honeypot/enrichment/threat/firehol-level1.txt }
      - { label: blocklist-de,   file: /etc/tarpit-honeypot/enrichment/threat/blocklist-de.txt }
    # - { label: tor-exits,      file: /etc/tarpit-honeypot/enrichment/threat/abuse-ch-feodo.txt }

ui:
  enabled: true
  bind: 127.0.0.1:8088
  refresh_seconds: 10   # live views auto-refresh every 10s (0 = off)
  # Non-loopback binds REQUIRE both tls_cert+tls_key AND auth_token_env.
  # tls_cert: /etc/tarpit-honeypot/ui.crt
  # tls_key:  /etc/tarpit-honeypot/ui.key
  # auth_token_env: TARPIT_UI_TOKEN
  # service_activity: true   # tint summary service cards that saw access/attempts (default on)
  # Enable/disable individual secondary pages in the console (nav link + route).
  # Core pages (summary/events/search/timeline/profiles/health/config) can't be
  # disabled. Omitted/true = shown; false = hidden + route 404s. Togglable slugs:
  # attack, correlation, campaigns, map, captures, credentials, dns, web,
  # databases, fleet, iocs, tunnels, fingerprints, devices, topology, charts,
  # alerting, errors, docs.
  # pages:
  #   docs: false
  #   topology: false

listeners:
  - id: ssh-bait
    proto: tcp
    bind: 0.0.0.0:2222
    mode: banner
    handler: ssh
    severity: high
    read_bytes: 1024
    read_timeout: 5s
    capture: true

  # ssh_interactive runs a full crypto/ssh server with a persistent
  # ed25519 host key (under <data_dir>/tls/ssh_host_ed25519_key) and
  # drops into the archetype's shell.Run loop after the 3rd auth
  # attempt. Captures every password / pubkey / typed command.
  # Note: uses CPU + memory per session; rate-limit with
  # max_concurrent for production deployments.
  - id: ssh-engage
    proto: tcp
    bind: 0.0.0.0:2223
    mode: banner
    handler: ssh_interactive
    severity: high
    read_timeout: 30s
    capture: true
    max_concurrent: 16

  - id: modbus-bait
    proto: tcp
    bind: 0.0.0.0:502
    mode: banner
    handler: modbus
    severity: critical
    read_bytes: 260
    read_timeout: 5s
    capture: true

  - id: s7-bait
    proto: tcp
    bind: 0.0.0.0:102
    mode: banner
    handler: s7
    severity: critical
    read_bytes: 256
    read_timeout: 5s
    capture: true

  - id: iec104-bait
    proto: tcp
    bind: 0.0.0.0:2404
    mode: banner
    handler: iec104
    severity: critical
    read_bytes: 256
    read_timeout: 5s

  # Sparkplug B (NBIRTH/DBIRTH/NDATA + protobuf payloads) is auto-recognized
  # inside the mqtt handler — no separate listener is needed.
  - id: mqtt-bait
    proto: tcp
    bind: 0.0.0.0:1883
    mode: banner
    handler: mqtt
    severity: high
    read_bytes: 1024
    read_timeout: 5s

  - id: http-bait
    proto: tcp
    bind: 0.0.0.0:8000
    mode: banner
    handler: http
    severity: medium
    read_bytes: 4096
    read_timeout: 5s
    # Web-deception decoy files (on by default; every field has a built-in
    # default, so an empty block already presents a trap-laden surface).
    web_deception:
      enabled: true
      # Bait paths advertised as Disallow in robots.txt; probing one raises
      # robots-honeypot-access.
      robots_disallow: ["/admin/", "/backup/", "/.git/", "/.env", "/wp-admin/"]
      # security.txt contacts — their local-parts (security, soc, …) become
      # honeytoken login names flagged across web/ftp/imap/pop3/smtp.
      security_contacts: ["security@honeypot.local", "soc@honeypot.local"]
      # Fake pages listed in sitemap.xml; each is served slowly (tarpit).
      sitemap_pages: ["/portal", "/hr/payroll.xlsx", "/backup/db-dump.sql", "/api/v1/users"]
      sitemap_tarpit: true
      sitemap_byte_interval_ms: 250

  - id: https-bait
    proto: tcp
    bind: 0.0.0.0:8443
    mode: banner
    handler: https
    severity: high
    read_bytes: 4096
    read_timeout: 5s
    https:
      hosts: ["honeypot.local"]

  - id: telnet-tarpit
    proto: tcp
    bind: 0.0.0.0:2323
    mode: tarpit
    severity: high
    tarpit:
      # strategy options: sticky | trickle | keepalive | jitter | backoff |
      #   ssh_banner | http_headers | http_chunked | echo | babble |
      #   zipbomb | zero_window  (last two are aggressive/retaliatory; opt-in only)
      strategy: sticky
      max_per_source: 4
      max_total: 256
      # jitter:      { text: "login: ", min_interval: 500ms, max_interval: 5s }
      # backoff:     { text: "login: ", start: 500ms, max: 60s, factor: 2 }
      # ssh_banner:  { line_interval: 2s, max_line_bytes: 32 }
      # http:        { status_line: "HTTP/1.1 200 OK", header_interval: 2s, chunk_interval: 2s, chunk_text: "." }
      # echo:        { byte_interval: 1s }
      # babble:      { byte_interval: 2s }
      # zipbomb:     { status_line: "HTTP/1.1 200 OK", decompressed_size: 10737418240, chunk_interval: 0s }
      # zero_window: { read_buffer: 1 }

  - id: ftp-bait
    proto: tcp
    bind: 0.0.0.0:2121
    mode: banner
    handler: ftp
    severity: medium
    read_bytes: 256
    read_timeout: 10s

  # ftp_files is the medium-interaction FTP server: allows anonymous
  # login (or a default-credential accept policy), serves a tree of
  # decoy files via PASV, and flags downloads of the bait files
  # (id_rsa, credentials.txt, database_dump.sql, config.bak) as the
  # honeyfile-download anomaly. accept_creds:
  #   none      -> capture only, reject every login (default)
  #   defaults  -> accept known vendor-default credentials
  #   any       -> accept anything (maximum engagement)
  - id: ftp-files-bait
    proto: tcp
    bind: 0.0.0.0:21
    mode: banner
    handler: ftp_files
    severity: high
    read_timeout: 30s
    capture: true
    accept_creds: defaults
    max_concurrent: 32

  # mDNS (multicast DNS / DNS-SD) — flags service-enumeration probes.
  - id: mdns-bait
    proto: udp
    bind: 0.0.0.0:5353
    mode: banner
    handler: mdns
    severity: low
    read_bytes: 1500

  - id: snmp-bait
    proto: udp
    bind: 0.0.0.0:161
    mode: banner
    handler: snmp
    severity: high
    read_bytes: 1500
    snmp:
      # Walkable MIB profile: minimal | host | network | full.
      # network/full also publish the honeynet topology as a real
      # ipNetToMediaTable (ARP table) that snmpwalk enumerates.
      mib_profile: network
      # Slow mass walkers: cap GetNext/GetBulk varbinds per source IP per
      # minute, then tarpit each over-limit response instead of dropping.
      walk_rate_per_min: 200
      walk_tarpit: 750ms

  - id: ntp-bait
    proto: udp
    bind: 0.0.0.0:123
    mode: banner
    handler: ntp
    severity: medium
    read_bytes: 64

  - id: opcua-bait
    proto: tcp
    bind: 0.0.0.0:4840
    mode: banner
    handler: opcua
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: enip-bait
    proto: tcp
    bind: 0.0.0.0:44818
    mode: banner
    handler: ethernetip
    severity: critical
    read_bytes: 1024
    read_timeout: 5s

  - id: smb-bait
    proto: tcp
    bind: 0.0.0.0:445
    mode: banner
    handler: smb
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: vnc-bait
    proto: tcp
    bind: 0.0.0.0:5900
    mode: banner
    handler: vnc
    severity: high
    read_timeout: 5s

  - id: smtp25-bait
    proto: tcp
    bind: 0.0.0.0:25
    mode: banner
    handler: smtp_recv
    severity: high
    read_timeout: 15s

  # POP3 / IMAP — mail-retrieval login capture (pair with a mailserver
  # archeservice, or stand them up directly like this).
  - id: pop3-bait
    proto: tcp
    bind: 0.0.0.0:110
    mode: banner
    handler: pop3
    severity: high
    read_timeout: 10s

  - id: imap-bait
    proto: tcp
    bind: 0.0.0.0:143
    mode: banner
    handler: imap
    severity: high
    read_timeout: 10s

  - id: rdp-bait
    proto: tcp
    bind: 0.0.0.0:3389
    mode: banner
    handler: rdp
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: winrm-bait
    proto: tcp
    bind: 0.0.0.0:5985
    mode: banner
    handler: winrm
    severity: high
    read_bytes: 8192
    read_timeout: 5s

  - id: dcerpc-bait
    proto: tcp
    bind: 0.0.0.0:135
    mode: banner
    handler: dcerpc
    severity: high
    read_bytes: 4096
    read_timeout: 5s

  - id: ldap-bait
    proto: tcp
    bind: 0.0.0.0:389
    mode: banner
    handler: ldap
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: kerberos-bait
    proto: tcp
    bind: 0.0.0.0:88
    mode: banner
    handler: kerberos
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: postgres-bait
    proto: tcp
    bind: 0.0.0.0:5432
    mode: banner
    handler: postgres
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: mysql-bait
    proto: tcp
    bind: 0.0.0.0:3306
    mode: banner
    handler: mysql
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: redis-bait
    proto: tcp
    bind: 0.0.0.0:6379
    mode: banner
    handler: redis
    severity: high
    read_bytes: 1024
    read_timeout: 5s

  # memcached — answers version/stats; flags stats recon, writes, flush_all.
  - id: memcached-bait
    proto: tcp
    bind: 0.0.0.0:11211
    mode: banner
    handler: memcached
    severity: high
    read_timeout: 5s

  # MongoDB — wire protocol isMaster/buildInfo; flags unauthenticated access.
  - id: mongodb-bait
    proto: tcp
    bind: 0.0.0.0:27017
    mode: banner
    handler: mongodb
    severity: high
    read_timeout: 5s

  # Elasticsearch — HTTP API cluster banner; flags unauth _search / _cat.
  - id: elasticsearch-bait
    proto: tcp
    bind: 0.0.0.0:9200
    mode: banner
    handler: elasticsearch
    severity: high
    read_timeout: 5s

  # MSSQL — TDS PRELOGIN exchange; advertises SQL Server 15.0, captures
  # the LOGIN7 username.
  - id: mssql-bait
    proto: tcp
    bind: 0.0.0.0:1433
    mode: banner
    handler: mssql
    severity: high
    read_timeout: 5s

  # Oracle Net (TNS) — captures the connect descriptor (SERVICE_NAME /
  # SID), replies REFUSE ORA-12514.
  - id: oracle-bait
    proto: tcp
    bind: 0.0.0.0:1521
    mode: banner
    handler: oracle_tns
    severity: high
    read_timeout: 5s

  # Intel AMT / vPro out-of-band management (CVE-2017-5689 surface) —
  # HTTP 401 Digest with the distinctive AMT Server header.
  - id: intel-amt-bait
    proto: tcp
    bind: 0.0.0.0:16992
    mode: banner
    handler: intel_amt
    severity: critical
    read_bytes: 2048
    read_timeout: 5s

  # Dell iDRAC out-of-band management — Basic-auth realm, captures
  # default-credential attempts (root/calvin).
  - id: idrac-bait
    proto: tcp
    bind: 0.0.0.0:9443
    mode: banner
    handler: idrac
    severity: critical
    read_bytes: 2048
    read_timeout: 5s

  # OpenVPN control channel — HARD_RESET exchange.
  - id: openvpn-bait
    proto: tcp
    bind: 0.0.0.0:1194
    mode: banner
    handler: openvpn
    severity: high
    read_timeout: 5s

  - id: ipmi-bait
    proto: udp
    bind: 0.0.0.0:623
    mode: banner
    handler: ipmi
    severity: high
    read_bytes: 256

  - id: bacnet-bait
    proto: udp
    bind: 0.0.0.0:47808
    mode: banner
    handler: bacnet
    severity: high
    read_bytes: 1500

  - id: tftp-bait
    proto: udp
    bind: 0.0.0.0:69
    mode: banner
    handler: tftp
    severity: high
    read_bytes: 1500

  # CoAP — UDP/5683. IoT discovery — RFC 7252. Replies to
  # GET /.well-known/core with a fake LED resource.
  - id: coap-bait
    proto: udp
    bind: 0.0.0.0:5683
    mode: banner
    handler: coap
    severity: high
    read_bytes: 1500

  # KNXnet/IP — UDP/3671. Building-automation bus tunnel; SEARCH_REQUEST
  # is the standard discovery probe, we answer as an MDT IP router.
  - id: knx-bait
    proto: udp
    bind: 0.0.0.0:3671
    mode: banner
    handler: knx
    severity: high
    read_bytes: 1500

  # DHCP — UDP/67. PASSIVE: never hands out leases. Captures the client
  # MAC / hostname / vendor-class / DHCP fingerprint (option-55 list)
  # from broadcast DISCOVER/REQUEST and feeds the learned-device
  # registry (see the devices: block below). Binding 67 needs the
  # broadcast packets to reach the socket — on Linux pair with
  # `SO_BROADCAST`-friendly routing or run on the segment gateway.
  - id: dhcp-observer
    proto: udp
    bind: 0.0.0.0:67
    mode: banner
    handler: dhcp
    severity: low
    read_bytes: 1500

  # XMPP — TCP/5222. Replies with stream:features advertising PLAIN +
  # SCRAM-SHA-1 so the scanner records us as Prosody/ejabberd. Captures
  # the SASL PLAIN credentials on follow-up.
  - id: xmpp-bait
    proto: tcp
    bind: 0.0.0.0:5222
    mode: banner
    handler: xmpp
    severity: high
    read_bytes: 4096

  # AMQP — TCP/5672. RabbitMQ-shaped Connection.Start, captures the
  # PLAIN credentials from Connection.StartOk, replies NOT_ALLOWED.
  - id: amqp-bait
    proto: tcp
    bind: 0.0.0.0:5672
    mode: banner
    handler: amqp
    severity: high
    read_bytes: 8192

  # IPP / CUPS — TCP/631. Answers Get-Printer-Attributes with a
  # believable Brother HL printer; standard target for IoT scanners.
  - id: ipp-bait
    proto: tcp
    bind: 0.0.0.0:631
    mode: banner
    handler: ipp
    severity: medium
    read_bytes: 8192

  # Resolving DNS — UDP/53. Answers A/AAAA/MX/TXT/NS/CNAME with
  # fabricated, deterministic-per-deployment records so a resolver
  # enumeration sees a live, populated server. Every query is run
  # through the same tunneling/exfil detection as the DNS canary.
  - id: dns-resolver
    proto: udp
    bind: 0.0.0.0:53
    mode: banner
    handler: dns
    severity: medium
    read_bytes: 4096

  # inetd "small services" (RFC 862-868, 1340). Trivial but heavily
  # probed. chargen + echo are classic UDP reflection/amplification
  # targets, so these handlers send exactly ONE bounded reply and never
  # amplify — the probe is captured, the sensor stays safe.
  - id: chargen-udp
    proto: udp
    bind: 0.0.0.0:19
    mode: banner
    handler: chargen
    severity: medium     # a UDP chargen probe is flagged udp-amplifier-probe
    read_bytes: 1500
  - id: echo-tcp
    proto: tcp
    bind: 0.0.0.0:7
    mode: banner
    handler: echo
    severity: low
    read_bytes: 1024
  - id: daytime-tcp
    proto: tcp
    bind: 0.0.0.0:13
    mode: banner
    handler: daytime
    severity: low
    read_timeout: 5s
  - id: time-udp
    proto: udp
    bind: 0.0.0.0:37
    mode: banner
    handler: time
    severity: low
    read_bytes: 64

  # Emulate-then-tarpit. mode:tarpit + tarpit.emulate runs the protocol
  # handler FIRST (real SSH banner + captured login attempt) and THEN
  # holds the connection open in the tarpit. The scanner gets a
  # believable service, hangs, and the captured banner/request lands in
  # the tarpit_start event. Set emulate:false (default) for a bare tarpit.
  - id: ssh-emulate-tarpit
    proto: tcp
    bind: 0.0.0.0:2224
    mode: tarpit
    handler: ssh
    severity: high
    read_timeout: 10s
    tarpit:
      strategy: sticky
      max_per_source: 4
      max_total: 256
      emulate: true

  # Generic catch-all: captures + fingerprints any unmodelled protocol on a
  # port you don't otherwise emulate, raising `unknown-protocol`. Point a wide
  # listener at it to cover everything not explicitly modelled. (UDP `auto`
  # never replies — no reflection/amplification.)
  - id: auto-catchall
    proto: tcp
    bind: 0.0.0.0:9999
    mode: banner
    handler: auto
    severity: medium
    read_bytes: 2048
    read_timeout: 5s

  # ------------------------------------------------------------------------
  # AI / agentic-attack decoys (commented reference — uncomment to enable).
  # The agentic honeypot recognizes A2A / AP2 / MCP / ACP agent traffic and
  # feeds counter-exfil breadcrumbs; the LLM / Ollama / MCP decoys emulate the
  # exposed inference + tool servers that agent frameworks probe for. Ports
  # below are canonical — if one clashes with an active listener above (MCP's
  # 8000 collides with http-bait here), rebind it before enabling both.
  # ------------------------------------------------------------------------
  # - id: agent-bait
  #   proto: tcp
  #   bind: 0.0.0.0:8080         # agentic provocateur (A2A/AP2/MCP/ACP)
  #   mode: banner
  #   handler: agent
  #   severity: high
  #   read_timeout: 30s
  # - id: ollama-bait
  #   proto: tcp
  #   bind: 0.0.0.0:11434        # Ollama inference-server decoy
  #   mode: banner
  #   handler: ollama
  #   severity: medium
  # - id: llm-openai-bait
  #   proto: tcp
  #   bind: 0.0.0.0:8081         # OpenAI-style /v1 LLM API decoy
  #   mode: banner
  #   handler: llm_openai
  #   severity: medium
  # - id: mcp-bait
  #   proto: tcp
  #   bind: 0.0.0.0:8000         # Model Context Protocol server decoy (rebind: clashes with http-bait)
  #   mode: banner
  #   handler: mcp
  #   severity: medium
  # - id: c2-emulator-bait
  #   proto: tcp
  #   bind: 0.0.0.0:8088         # fake C2 team-server (beacon/stager recognition; canonical 8080/80)
  #   mode: banner
  #   handler: c2_emulator
  #   severity: high

  # ------------------------------------------------------------------------
  # Additional OT / ICS protocols (commented reference — uncomment to enable).
  # ------------------------------------------------------------------------
  # - id: bacnet-sc-bait
  #   proto: tcp
  #   bind: 0.0.0.0:47808        # BACnet Secure Connect (WS+TLS BMS data link)
  #   mode: banner
  #   handler: bacnet_sc         # TLS-fronted real-world variant: handler: bacnet_scs
  #   severity: critical
  # - id: mbus-bait
  #   proto: tcp
  #   bind: 0.0.0.0:10001        # M-Bus meter gateway
  #   mode: banner
  #   handler: mbus
  #   severity: high
  # - id: dlms-bait
  #   proto: tcp
  #   bind: 0.0.0.0:4059         # DLMS/COSEM smart-metering
  #   mode: banner
  #   handler: dlms
  #   severity: high
  # - id: osisoft-pi-bait
  #   proto: tcp
  #   bind: 0.0.0.0:5450         # OSIsoft PI historian
  #   mode: banner
  #   handler: osisoft_pi
  #   severity: high
  # - id: fox-bait
  #   proto: tcp
  #   bind: 0.0.0.0:1911         # Niagara / Tridium Fox (BMS)
  #   mode: banner
  #   handler: fox
  #   severity: high
  # - id: iccp-secure-bait
  #   proto: tcp
  #   bind: 0.0.0.0:3782         # Secure ICCP / TASE.2 (inter-control-center)
  #   mode: banner
  #   handler: iccp_secure
  #   severity: critical

  # ------------------------------------------------------------------------
  # Decoy loot / lures / breadcrumbs. There is no YAML for these — generate the
  # files, then let the ftp_files + http (webapp) listeners above serve them:
  #   tarpit-honeypot gen-wallet-decoys    --out <loot_dir>   # fake crypto wallets
  #   tarpit-honeypot gen-lures            --out <loot_dir>   # fake aws/ssh/.env/kubeconfig lures
  #   tarpit-honeypot gen-agent-breadcrumb --out <loot_dir>   # lure crawling agents to the agent decoy
  # Point the ftp_files served tree / the webapp download root at <loot_dir>.
  # ------------------------------------------------------------------------

canaries:
  - id: shared-creds
    path: ./var/canary/passwords.xlsx
    events: [write, remove, rename, chmod]
    severity: critical

# URL canary tokens — embed these in fake docs / emails / config files.
# Any HTTP/HTTPS listener request that exactly matches the path fires
# a canary:url:<id> event in addition to the normal listener event.
url_canaries:
  - id: aws-prod-tarball
    path: /backup/aws-prod.tar.gz
    severity: critical
  - id: admin-config
    path: /admin/db-config.json
    severity: critical

# DNS canary names — embed these in scripts/configs so any DNS resolution
# (data exfil-shaped or otherwise) fires a canary:dns:<id> event.
dns:
  enabled: true
  bind: 127.0.0.1:5354     # bind to :53 in production
  # Detect amplifier-shaped traffic: any qtype=ANY (255) query OR
  # `queries` queries from the same source within `window`.
  amplifier_detection:
    enabled: true
    window: 60s
    queries: 20
    severity: high
dns_canaries:
  - id: prod-customer-data
    name: prod-cdb-x7q.canary.example.com
    severity: critical

# Layer-2 sniffer (Linux only; needs CAP_NET_RAW).
# Watches the local segment for ARP scans (same MAC, many distinct IPs)
# and unsolicited ARP replies (potential cache poisoning).
sniffer:
  enabled: false
  interface: ""            # empty = all interfaces
  severity: high
  arp_scan:
    distinct_ips: 16
    window: 30s

# Artificial networks ("honeynets"). Each honeynet declares one CIDR,
# a gateway / DNS / domain (free-form metadata), and zero or many
# virtual hosts. Each host has zero or many services on specific ports.
#
# How dispatch works:
#   1. The OS must route the host IPs to the sensor. On Linux that's
#      usually `ip addr add 10.99.0.10/24 dev lo` for testing, or a
#      bridge / NAT / TUN setup in production.
#   2. The sensor's listeners must bind 0.0.0.0:<port> for every port
#      any honeynet host serves.
#   3. On accept(), the listener inspects the destination IP. If it
#      matches a honeynet host with a service on that port, the sensor
#      dispatches to a per-host handler instance whose Identity is
#      derived from sensor.deployment_id + the virtual host id. Each
#      virtual machine therefore presents a distinct SSH banner / MySQL
#      version / SMB challenge to scanners.
#   4. Events get honeynet / honeynet_host / honeynet_hostname /
#      honeynet_os meta keys for downstream grouping.
#
# Zero honeynets is the default — leave the list out (or empty) and
# everything dispatches through the normal listener.handler config.
#
# When at least one honeynet is configured, the DNS canary listener
# also forward-resolves honeynet hostnames (short name or
# hostname.domain) to the virtual IP.
honeynets:
  - id: corp-lan
    cidr: 10.99.0.0/24
    gateway: 10.99.0.1
    dns: 10.99.0.2
    domain: corp.example.local
    # Linux only. When enabled, the sensor opens an AF_PACKET socket on
    # `interface` (empty = first non-loopback up iface) and replies to ARP
    # requests for any virtual host IP with that host's deterministic MAC.
    # Makes the network discoverable on the L2 segment without `ip addr add`.
    # NOTE: ARP responding alone is L2 discovery; TCP/UDP traffic still
    # needs `ip addr add` or iptables redirection to reach the sensor's
    # real sockets.
    arp_responder:
      enabled: false
      interface: ""
    # Linux only. When enabled, the sensor answers ICMP echo requests
    # (ping) addressed to any virtual host IP with a proper echo reply
    # sourced from the host's derived MAC + IP. Same CAP_NET_RAW
    # requirement as the ARP responder; pair them so virtual hosts
    # both show up in arp-scan and respond to ping.
    # On macOS / BSD use `ifconfig <iface> alias <ip>` per host — the
    # kernel answers ARP / ICMP echo natively for the alias.
    icmp_responder:
      enabled: false
      interface: ""
    # Linux only. When enabled, the sensor periodically emits LLDP
    # frames (and optionally CDP frames) so every virtual host appears
    # in `lldpctl` / Cisco `show cdp neighbors` output. The advertised
    # MAC + system description come from the host's archetype, so a
    # Moxa-archetype host advertises a Moxa-OUI MAC + Moxa system
    # description. CAP_NET_RAW required.
    lldp_responder:
      enabled: false
      interface: ""
      interval_s: 30
      include_cdp: false   # also emit Cisco CDP frames for cdp-aware scanners
    # Linux-only adapter. Opens a TUN device; operator routes the honeynet
    # CIDR through it. The sensor answers ICMP/ICMPv6 echo for virtual host
    # IPs, and an embedded userspace TCP stack completes handshakes on each
    # host's `services` ports with a SYN-ACK shaped to the host archetype's
    # stack fingerprint (TTL/window/MSS/wscale/SACK/timestamps/option order
    # — what `nmap -O` / p0f read), answers a single request/response from
    # the archetype banners, RSTs unbound ports, and captures malformed /
    # illegal packets (NULL/FIN/Xmas, SYN-FIN, bad checksums, fragments) as
    # events — all without `ip addr add` per host. CAP_NET_ADMIN required.
    # macOS supports utun but no native backend yet — use `ifconfig alias`.
    tun:
      enabled: false
      device: ""           # blank = kernel-chosen (e.g. tun0)
      mtu: 1500
    hosts:
      - ip: 10.99.0.10
        hostname: web-prod-01
        os: linux
        services:
          - { port: 22,  handler: ssh }
          - { port: 80,  handler: http }
          - { port: 443, handler: https }
      - ip: 10.99.0.11
        hostname: db-prod-01
        os: linux
        services:
          - { port: 22,   handler: ssh }
          - { port: 3306, handler: mysql }
          - { port: 5432, handler: postgres }
      - ip: 10.99.0.20
        hostname: dc-01
        os: windows
        services:
          - { port: 88,   handler: kerberos }
          - { port: 135,  handler: dcerpc }
          - { port: 389,  handler: ldap }
          - { port: 445,  handler: smb }
          - { port: 3389, handler: rdp }

  - id: ot-cell-A
    cidr: 10.99.5.0/24
    gateway: 10.99.5.1
    domain: ot-a.example.local
    hosts:
      - ip: 10.99.5.50
        hostname: plc-press-01
        os: ics
        services:
          - { port: 102, handler: s7 }
          - { port: 502, handler: modbus }
      - ip: 10.99.5.51
        hostname: hmi-press-01
        os: windows
        services:
          - { port: 4840, handler: opcua }
          - { port: 3389, handler: rdp }

# Declarative operator detection-rule engine: point it at a directory of
# Sigma-style YAML rules (internal/detect) matched against every event. The
# repo ships a starter pack under configs/rules/ (agentic, exfil-and-c2,
# ot-ics-control, web-exploit, credential-access, …). The path is
# deployment-specific, so it's commented here; `validate-config` loads and
# checks the rules when it's set.
# detection:
#   rules_dir: /etc/tarpit-honeypot/rules    # e.g. the shipped configs/rules/

# Fleet / multi-sensor topology (forward, ingest, fleet correlation, intel feed)
# lives in its own reference set: see examples/fleet/ (leaf-sensor.yaml →
# site-aggregator.yaml → global-hub.yaml) for the forward:/ingest:/fleet: blocks.

correlate:
  port_scan:
    enabled: true
    distinct_ports: 5
    window: 30s
    severity: high
  brute_force:
    enabled: true
    attempts: 10
    window: 60s
    per_port: true
    severity: high
  # Catch the "one port per hour" scan that slides through the fixed
  # port_scan window. Per-source state ages out entry-by-entry.
  slow_scan:
    enabled: true
    distinct_ports: 10
    window: 24h
    severity: high
  # ICMP ping sweep: one source touching N distinct destination IPs via
  # ICMP (echo / timestamp / address-mask) inside the window. Maps the
  # live-host inventory of a subnet — a classic discovery precursor.
  # Fed by the honeynet ICMP responder's per-interaction events.
  icmp_sweep:
    enabled: true
    distinct_ips: 10
    window: 30s
    severity: high
  # One source spraying many DISTINCT usernames (breadth, not depth).
  password_spray:
    enabled: true
    distinct_users: 5
    window: 300s
    severity: high
  # The SAME credential pair from many DISTINCT source IPs (a shared list /
  # botnet — credential stuffing). The password is never logged.
  credential_reuse:
    enabled: true
    distinct_sources: 3
    window: 1h
    severity: high
  # HTTP content discovery / dirbusting: many distinct URL paths from one
  # source (catches scanners that spoof a browser User-Agent).
  path_enumeration:
    enabled: true
    distinct_paths: 50
    window: 60s
    severity: high
  # DNS name enumeration: subdomain brute force / NXDOMAIN flood / DGA churn.
  dns_enumeration:
    enabled: true
    distinct_names: 50
    window: 60s
    severity: medium
  # C2 beaconing: regularly-spaced call-home from one source. After min_hits
  # samples, low inter-arrival jitter over a non-trivial interval = a beacon.
  beacon:
    enabled: true
    min_hits: 6
    max_jitter_pct: 20
    window: 1h
    severity: high

# CISA Known Exploited Vulnerabilities (KEV) auto-sync. When enabled the sensor
# pulls the KEV catalog on `poll` and stamps every cve:<id> event whose CVE is
# KEV-listed with kev=true + kev_date_added + kev_known_ransomware, lifting its
# severity to at least High. The feed host (www.cisa.gov) is fetched through the
# egress-governed client, so add it to egress.allow when egress is enabled. Use
# `file:` for the offline / air-gapped path (scripts/fetch-kev.sh installs it).
# kev:
#   enabled: true
#   # url: ""                  # empty = the authoritative CISA KEV JSON feed
#   poll: 6h
#   # header: "Name: value"    # optional request header (e.g. a proxy token)
#   # file: /etc/tarpit-honeypot/kev/known_exploited_vulnerabilities.json

# Interaction depth + experimental-feature guardrails. low (default) means
# every emitted capture is something this emulator can actually produce;
# the *_experimental knobs only unlock under medium_experimental and are a
# config error in low mode. See `tarpit-honeypot list-unavailable-capabilities`.
interaction:
  mode: low                      # low | medium_experimental
  http2_probe_capture: disabled  # disabled | headers_only (needs medium_experimental)
  ssh_kex_depth: kexinit_only    # kexinit_only | extended_experimental (needs medium_experimental)
  browser_traps: off             # locked off — no real browser is driven

dedup:
  default_window: 5m

# Learned-device inventory + "new device" alerting. When enabled, the
# sensor records every host it observes (DHCP, ARP sniffer, broadcast/
# multicast handlers, and the source IP of every handled connection)
# into <data_dir>/devices.json and raises a device:new event for hosts
# that are neither allow-listed nor part of the learned baseline.
# Review with `tarpit-honeypot list-devices`.
devices:
  enabled: false
  # learn=true : the first run silently records a baseline; later
  #              never-seen devices alert.
  # learn=false: strict allow-list mode — every device that isn't in
  #              `allow` alerts on first sight.
  learn: true
  severity: high
  allow:
    - 127.0.0.1
    - 10.0.0.0/8          # the corporate range we already know about
    - aa:bb:cc:dd:ee:ff   # the gateway's MAC

allowlist:
  - 127.0.0.1/32
  - ::1/128

channels:
  - id: stdout
    type: stdout
    min_severity: low

  - id: jsonlog
    type: jsonlog
    min_severity: low

  - id: sqlite
    type: sqlite
    min_severity: low

  # Outbound channels (uncomment + fill in env vars to enable):
  #
  # - id: ops-webhook
  #   type: webhook
  #   url: https://hooks.example.com/tarpit
  #   hmac_secret_env: TARPIT_WEBHOOK_SECRET
  #   timeout: 5s
  #   min_severity: medium
  #
  # - id: ops-sms
  #   type: twilio
  #   account_sid_env: TWILIO_SID
  #   auth_token_env:  TWILIO_TOKEN
  #   from: "+15555550100"
  #   to: ["+15555550111"]
  #   min_severity: critical
  #   rate_limit_per_min: 6
  #
  # - id: ops-sns
  #   type: sns
  #   topic_arn: arn:aws:sns:us-east-1:123456789012:tarpit-alerts
  #   access_key_env: AWS_ACCESS_KEY_ID
  #   secret_key_env: AWS_SECRET_ACCESS_KEY
  #   min_severity: high
  #
  # - id: nms-trap
  #   type: snmptrap
  #   host: nms.example.internal
  #   port: 162
  #   community: tarpit
  #   enterprise_oid: "1.3.6.1.4.1.65535"
  #   min_severity: medium

routes:
  - match:
      severity: ">=low"
    channels: [stdout, jsonlog, sqlite]
