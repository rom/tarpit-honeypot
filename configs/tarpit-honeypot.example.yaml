sensor:
  name: ""                                  # blank = hostname
  data_dir: ./var
  # Stable random seed used to derive per-deployment unique values
  # (SSH banner version, SMB challenge bytes, fake device serials, etc).
  # Blank = auto-generate on first run and persist to <data_dir>/.deployment-id.
  deployment_id: ""
  # OS-shaped banner profile. When set, SSH / HTTP(S) / FTP / Telnet /
  # SMTP / MySQL handlers report banners consistent with a stock install
  # of this distribution, so a scanner can't catch the sensor by spotting
  # version-vs-distro mismatches.
  #
  # `tarpit-honeypot help archetypes` lists the 15 valid names.
  # Per-listener and per-honeynet-host overrides take precedence.
  # Blank = fall back to the deployment-id-keyed variant pool.
  archetype: ""                              # e.g. "debian 12", "ubuntu 24.04 lts"
  # On Linux, after privileged setup the sensor will switch to this user/group.
  # Use with systemd AmbientCapabilities=CAP_NET_BIND_SERVICE to keep
  # privileged ports working. Leave blank when running unprivileged anyway.
  drop_user: ""
  drop_group: ""
  # Randomized response delay on every handler reply. Defeats
  # microsecond-identical-latency scanner fingerprints.
  jitter:
    enabled: true
    min_ms: 5
    max_ms: 50
  # Auto-rotate the self-signed HTTPS cert older than this many days. 0 = never.
  tls_rotate:
    days: 30
  # Wait at most this long for in-flight handler goroutines to finish
  # on SIGTERM before force-cancelling them.
  shutdown:
    drain_timeout: 10s
  disk:
    json_log_mb: 500
    sqlite_mb: 500
    pcap_mb: 1024       # total cap for the captures directory
    capture_kb: 64      # per-session cap before truncation
    retention_days: 0   # 0 = no time-based retention; otherwise events / files / db rows older than this are pruned hourly
  # Source-IP enrichment. Each event's meta gets geo_country / geo_city /
  # asn / asn_org / rdns when configured. Loopback + RFC 1918 / RFC 4193
  # private sources are not enriched. The .mmdb files must be supplied by
  # the operator (MaxMind GeoLite2 license restricts redistribution).
  geoip:
    city_db: ""          # e.g. /var/lib/GeoLite2-City.mmdb
    asn_db:  ""          # e.g. /var/lib/GeoLite2-ASN.mmdb
  rdns:
    enabled: false
    timeout: 500ms       # bounded so a stalled resolver can't back up the bus
    cache_size: 1024     # LRU cache size

ui:
  enabled: true
  bind: 127.0.0.1:8088
  # Non-loopback binds REQUIRE both tls_cert+tls_key AND auth_token_env.
  # tls_cert: /etc/tarpit-honeypot/ui.crt
  # tls_key:  /etc/tarpit-honeypot/ui.key
  # auth_token_env: TARPIT_UI_TOKEN

listeners:
  - id: ssh-bait
    proto: tcp
    bind: 0.0.0.0:2222
    mode: banner
    handler: ssh
    severity: high
    read_bytes: 1024
    read_timeout: 5s
    capture: true

  # ssh_interactive runs a full crypto/ssh server with a persistent
  # ed25519 host key (under <data_dir>/tls/ssh_host_ed25519_key) and
  # drops into the archetype's shell.Run loop after the 3rd auth
  # attempt. Captures every password / pubkey / typed command.
  # Note: uses CPU + memory per session; rate-limit with
  # max_concurrent for production deployments.
  - id: ssh-engage
    proto: tcp
    bind: 0.0.0.0:2223
    mode: banner
    handler: ssh_interactive
    severity: high
    read_timeout: 30s
    capture: true
    max_concurrent: 16

  - id: modbus-bait
    proto: tcp
    bind: 0.0.0.0:502
    mode: banner
    handler: modbus
    severity: critical
    read_bytes: 260
    read_timeout: 5s
    capture: true

  - id: s7-bait
    proto: tcp
    bind: 0.0.0.0:102
    mode: banner
    handler: s7
    severity: critical
    read_bytes: 256
    read_timeout: 5s
    capture: true

  - id: iec104-bait
    proto: tcp
    bind: 0.0.0.0:2404
    mode: banner
    handler: iec104
    severity: critical
    read_bytes: 256
    read_timeout: 5s

  - id: mqtt-bait
    proto: tcp
    bind: 0.0.0.0:1883
    mode: banner
    handler: mqtt
    severity: high
    read_bytes: 1024
    read_timeout: 5s

  - id: http-bait
    proto: tcp
    bind: 0.0.0.0:8000
    mode: banner
    handler: http
    severity: medium
    read_bytes: 4096
    read_timeout: 5s

  - id: https-bait
    proto: tcp
    bind: 0.0.0.0:8443
    mode: banner
    handler: https
    severity: high
    read_bytes: 4096
    read_timeout: 5s
    https:
      hosts: ["honeypot.local"]

  - id: telnet-tarpit
    proto: tcp
    bind: 0.0.0.0:2323
    mode: tarpit
    severity: high
    tarpit:
      strategy: sticky
      max_per_source: 4
      max_total: 256

  - id: ftp-bait
    proto: tcp
    bind: 0.0.0.0:2121
    mode: banner
    handler: ftp
    severity: medium
    read_bytes: 256
    read_timeout: 10s

  # ftp_files is the medium-interaction FTP server: allows anonymous
  # login (or a default-credential accept policy), serves a tree of
  # decoy files via PASV, and flags downloads of the bait files
  # (id_rsa, credentials.txt, database_dump.sql, config.bak) as the
  # honeyfile-download anomaly. accept_creds:
  #   none      -> capture only, reject every login (default)
  #   defaults  -> accept known vendor-default credentials
  #   any       -> accept anything (maximum engagement)
  - id: ftp-files-bait
    proto: tcp
    bind: 0.0.0.0:21
    mode: banner
    handler: ftp_files
    severity: high
    read_timeout: 30s
    capture: true
    accept_creds: defaults
    max_concurrent: 32

  - id: udp-5353
    proto: udp
    bind: 0.0.0.0:5353
    mode: drop
    severity: low
    read_bytes: 1500

  - id: snmp-bait
    proto: udp
    bind: 0.0.0.0:161
    mode: banner
    handler: snmp
    severity: high
    read_bytes: 1500

  - id: ntp-bait
    proto: udp
    bind: 0.0.0.0:123
    mode: banner
    handler: ntp
    severity: medium
    read_bytes: 64

  - id: opcua-bait
    proto: tcp
    bind: 0.0.0.0:4840
    mode: banner
    handler: opcua
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: enip-bait
    proto: tcp
    bind: 0.0.0.0:44818
    mode: banner
    handler: ethernetip
    severity: critical
    read_bytes: 1024
    read_timeout: 5s

  - id: smb-bait
    proto: tcp
    bind: 0.0.0.0:445
    mode: banner
    handler: smb
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: vnc-bait
    proto: tcp
    bind: 0.0.0.0:5900
    mode: banner
    handler: vnc
    severity: high
    read_timeout: 5s

  - id: smtp25-bait
    proto: tcp
    bind: 0.0.0.0:25
    mode: banner
    handler: smtp_recv
    severity: high
    read_timeout: 15s

  - id: rdp-bait
    proto: tcp
    bind: 0.0.0.0:3389
    mode: banner
    handler: rdp
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: winrm-bait
    proto: tcp
    bind: 0.0.0.0:5985
    mode: banner
    handler: winrm
    severity: high
    read_bytes: 8192
    read_timeout: 5s

  - id: dcerpc-bait
    proto: tcp
    bind: 0.0.0.0:135
    mode: banner
    handler: dcerpc
    severity: high
    read_bytes: 4096
    read_timeout: 5s

  - id: ldap-bait
    proto: tcp
    bind: 0.0.0.0:389
    mode: banner
    handler: ldap
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: kerberos-bait
    proto: tcp
    bind: 0.0.0.0:88
    mode: banner
    handler: kerberos
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: postgres-bait
    proto: tcp
    bind: 0.0.0.0:5432
    mode: banner
    handler: postgres
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: mysql-bait
    proto: tcp
    bind: 0.0.0.0:3306
    mode: banner
    handler: mysql
    severity: critical
    read_bytes: 4096
    read_timeout: 5s

  - id: redis-bait
    proto: tcp
    bind: 0.0.0.0:6379
    mode: banner
    handler: redis
    severity: high
    read_bytes: 1024
    read_timeout: 5s

  - id: ipmi-bait
    proto: udp
    bind: 0.0.0.0:623
    mode: banner
    handler: ipmi
    severity: high
    read_bytes: 256

  - id: bacnet-bait
    proto: udp
    bind: 0.0.0.0:47808
    mode: banner
    handler: bacnet
    severity: high
    read_bytes: 1500

  - id: tftp-bait
    proto: udp
    bind: 0.0.0.0:69
    mode: banner
    handler: tftp
    severity: high
    read_bytes: 1500

  # CoAP — UDP/5683. IoT discovery — RFC 7252. Replies to
  # GET /.well-known/core with a fake LED resource.
  - id: coap-bait
    proto: udp
    bind: 0.0.0.0:5683
    mode: banner
    handler: coap
    severity: high
    read_bytes: 1500

  # KNXnet/IP — UDP/3671. Building-automation bus tunnel; SEARCH_REQUEST
  # is the standard discovery probe, we answer as an MDT IP router.
  - id: knx-bait
    proto: udp
    bind: 0.0.0.0:3671
    mode: banner
    handler: knx
    severity: high
    read_bytes: 1500

  # DHCP — UDP/67. PASSIVE: never hands out leases. Captures the client
  # MAC / hostname / vendor-class / DHCP fingerprint (option-55 list)
  # from broadcast DISCOVER/REQUEST and feeds the learned-device
  # registry (see the devices: block below). Binding 67 needs the
  # broadcast packets to reach the socket — on Linux pair with
  # `SO_BROADCAST`-friendly routing or run on the segment gateway.
  - id: dhcp-observer
    proto: udp
    bind: 0.0.0.0:67
    mode: banner
    handler: dhcp
    severity: low
    read_bytes: 1500

  # XMPP — TCP/5222. Replies with stream:features advertising PLAIN +
  # SCRAM-SHA-1 so the scanner records us as Prosody/ejabberd. Captures
  # the SASL PLAIN credentials on follow-up.
  - id: xmpp-bait
    proto: tcp
    bind: 0.0.0.0:5222
    mode: banner
    handler: xmpp
    severity: high
    read_bytes: 4096

  # AMQP — TCP/5672. RabbitMQ-shaped Connection.Start, captures the
  # PLAIN credentials from Connection.StartOk, replies NOT_ALLOWED.
  - id: amqp-bait
    proto: tcp
    bind: 0.0.0.0:5672
    mode: banner
    handler: amqp
    severity: high
    read_bytes: 8192

  # IPP / CUPS — TCP/631. Answers Get-Printer-Attributes with a
  # believable Brother HL printer; standard target for IoT scanners.
  - id: ipp-bait
    proto: tcp
    bind: 0.0.0.0:631
    mode: banner
    handler: ipp
    severity: medium
    read_bytes: 8192

canaries:
  - id: shared-creds
    path: ./var/canary/passwords.xlsx
    events: [write, remove, rename, chmod]
    severity: critical

# URL canary tokens — embed these in fake docs / emails / config files.
# Any HTTP/HTTPS listener request that exactly matches the path fires
# a canary:url:<id> event in addition to the normal listener event.
url_canaries:
  - id: aws-prod-tarball
    path: /backup/aws-prod.tar.gz
    severity: critical
  - id: admin-config
    path: /admin/db-config.json
    severity: critical

# DNS canary names — embed these in scripts/configs so any DNS resolution
# (data exfil-shaped or otherwise) fires a canary:dns:<id> event.
dns:
  enabled: true
  bind: 127.0.0.1:5354     # bind to :53 in production
  # Detect amplifier-shaped traffic: any qtype=ANY (255) query OR
  # `queries` queries from the same source within `window`.
  amplifier_detection:
    enabled: true
    window: 60s
    queries: 20
    severity: high
dns_canaries:
  - id: prod-customer-data
    name: prod-cdb-x7q.canary.example.com
    severity: critical

# Layer-2 sniffer (Linux only; needs CAP_NET_RAW).
# Watches the local segment for ARP scans (same MAC, many distinct IPs)
# and unsolicited ARP replies (potential cache poisoning).
sniffer:
  enabled: false
  interface: ""            # empty = all interfaces
  severity: high
  arp_scan:
    distinct_ips: 16
    window: 30s

# Artificial networks ("honeynets"). Each honeynet declares one CIDR,
# a gateway / DNS / domain (free-form metadata), and zero or many
# virtual hosts. Each host has zero or many services on specific ports.
#
# How dispatch works:
#   1. The OS must route the host IPs to the sensor. On Linux that's
#      usually `ip addr add 10.99.0.10/24 dev lo` for testing, or a
#      bridge / NAT / TUN setup in production.
#   2. The sensor's listeners must bind 0.0.0.0:<port> for every port
#      any honeynet host serves.
#   3. On accept(), the listener inspects the destination IP. If it
#      matches a honeynet host with a service on that port, the sensor
#      dispatches to a per-host handler instance whose Identity is
#      derived from sensor.deployment_id + the virtual host id. Each
#      virtual machine therefore presents a distinct SSH banner / MySQL
#      version / SMB challenge to scanners.
#   4. Events get honeynet / honeynet_host / honeynet_hostname /
#      honeynet_os meta keys for downstream grouping.
#
# Zero honeynets is the default — leave the list out (or empty) and
# everything dispatches through the normal listener.handler config.
#
# When at least one honeynet is configured, the DNS canary listener
# also forward-resolves honeynet hostnames (short name or
# hostname.domain) to the virtual IP.
honeynets:
  - id: corp-lan
    cidr: 10.99.0.0/24
    gateway: 10.99.0.1
    dns: 10.99.0.2
    domain: corp.example.local
    # Linux only. When enabled, the sensor opens an AF_PACKET socket on
    # `interface` (empty = first non-loopback up iface) and replies to ARP
    # requests for any virtual host IP with that host's deterministic MAC.
    # Makes the network discoverable on the L2 segment without `ip addr add`.
    # NOTE: ARP responding alone is L2 discovery; TCP/UDP traffic still
    # needs `ip addr add` or iptables redirection to reach the sensor's
    # real sockets.
    arp_responder:
      enabled: false
      interface: ""
    # Linux only. When enabled, the sensor answers ICMP echo requests
    # (ping) addressed to any virtual host IP with a proper echo reply
    # sourced from the host's derived MAC + IP. Same CAP_NET_RAW
    # requirement as the ARP responder; pair them so virtual hosts
    # both show up in arp-scan and respond to ping.
    # On macOS / BSD use `ifconfig <iface> alias <ip>` per host — the
    # kernel answers ARP / ICMP echo natively for the alias.
    icmp_responder:
      enabled: false
      interface: ""
    # Linux only. When enabled, the sensor periodically emits LLDP
    # frames (and optionally CDP frames) so every virtual host appears
    # in `lldpctl` / Cisco `show cdp neighbors` output. The advertised
    # MAC + system description come from the host's archetype, so a
    # Moxa-archetype host advertises a Moxa-OUI MAC + Moxa system
    # description. CAP_NET_RAW required.
    lldp_responder:
      enabled: false
      interface: ""
      interval_s: 30
      include_cdp: false   # also emit Cisco CDP frames for cdp-aware scanners
    # Linux-only L3 adapter. Opens a TUN device; operator routes the
    # honeynet CIDR through it. Sensor answers ICMP/ICMPv6 echo for
    # virtual host IPs and sends TCP RST for unbound ports — so
    # `nmap -sS` reports the host as alive without `ip addr add`.
    # CAP_NET_ADMIN required. macOS supports utun but no native
    # backend yet — use `ifconfig alias` as a workaround.
    tun:
      enabled: false
      device: ""           # blank = kernel-chosen (e.g. tun0)
      mtu: 1500
    hosts:
      - ip: 10.99.0.10
        hostname: web-prod-01
        os: linux
        services:
          - { port: 22,  handler: ssh }
          - { port: 80,  handler: http }
          - { port: 443, handler: https }
      - ip: 10.99.0.11
        hostname: db-prod-01
        os: linux
        services:
          - { port: 22,   handler: ssh }
          - { port: 3306, handler: mysql }
          - { port: 5432, handler: postgres }
      - ip: 10.99.0.20
        hostname: dc-01
        os: windows
        services:
          - { port: 88,   handler: kerberos }
          - { port: 135,  handler: dcerpc }
          - { port: 389,  handler: ldap }
          - { port: 445,  handler: smb }
          - { port: 3389, handler: rdp }

  - id: ot-cell-A
    cidr: 10.99.5.0/24
    gateway: 10.99.5.1
    domain: ot-a.example.local
    hosts:
      - ip: 10.99.5.50
        hostname: plc-press-01
        os: ics
        services:
          - { port: 102, handler: s7 }
          - { port: 502, handler: modbus }
      - ip: 10.99.5.51
        hostname: hmi-press-01
        os: windows
        services:
          - { port: 4840, handler: opcua }
          - { port: 3389, handler: rdp }

correlate:
  port_scan:
    enabled: true
    distinct_ports: 5
    window: 30s
    severity: high
  brute_force:
    enabled: true
    attempts: 10
    window: 60s
    per_port: true
    severity: high
  # Catch the "one port per hour" scan that slides through the fixed
  # port_scan window. Per-source state ages out entry-by-entry.
  slow_scan:
    enabled: true
    distinct_ports: 10
    window: 24h
    severity: high
  # ICMP ping sweep: one source touching N distinct destination IPs via
  # ICMP (echo / timestamp / address-mask) inside the window. Maps the
  # live-host inventory of a subnet — a classic discovery precursor.
  # Fed by the honeynet ICMP responder's per-interaction events.
  icmp_sweep:
    enabled: true
    distinct_ips: 10
    window: 30s
    severity: high

dedup:
  default_window: 5m

# Learned-device inventory + "new device" alerting. When enabled, the
# sensor records every host it observes (DHCP, ARP sniffer, broadcast/
# multicast handlers, and the source IP of every handled connection)
# into <data_dir>/devices.json and raises a device:new event for hosts
# that are neither allow-listed nor part of the learned baseline.
# Review with `tarpit-honeypot list-devices`.
devices:
  enabled: false
  # learn=true : the first run silently records a baseline; later
  #              never-seen devices alert.
  # learn=false: strict allow-list mode — every device that isn't in
  #              `allow` alerts on first sight.
  learn: true
  severity: high
  allow:
    - 127.0.0.1
    - 10.0.0.0/8          # the corporate range we already know about
    - aa:bb:cc:dd:ee:ff   # the gateway's MAC

allowlist:
  - 127.0.0.1/32
  - ::1/128

channels:
  - id: stdout
    type: stdout
    min_severity: low

  - id: jsonlog
    type: jsonlog
    min_severity: low

  - id: sqlite
    type: sqlite
    min_severity: low

  # Outbound channels (uncomment + fill in env vars to enable):
  #
  # - id: ops-webhook
  #   type: webhook
  #   url: https://hooks.example.com/tarpit
  #   hmac_secret_env: TARPIT_WEBHOOK_SECRET
  #   timeout: 5s
  #   min_severity: medium
  #
  # - id: ops-sms
  #   type: twilio
  #   account_sid_env: TWILIO_SID
  #   auth_token_env:  TWILIO_TOKEN
  #   from: "+15555550100"
  #   to: ["+15555550111"]
  #   min_severity: critical
  #   rate_limit_per_min: 6
  #
  # - id: ops-sns
  #   type: sns
  #   topic_arn: arn:aws:sns:us-east-1:123456789012:tarpit-alerts
  #   access_key_env: AWS_ACCESS_KEY_ID
  #   secret_key_env: AWS_SECRET_ACCESS_KEY
  #   min_severity: high
  #
  # - id: nms-trap
  #   type: snmptrap
  #   host: nms.example.internal
  #   port: 162
  #   community: tarpit
  #   enterprise_oid: "1.3.6.1.4.1.65535"
  #   min_severity: medium

routes:
  - match:
      severity: ">=low"
    channels: [stdout, jsonlog, sqlite]
