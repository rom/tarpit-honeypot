sensor:
  name: ""                                  # blank = hostname
  data_dir: ./var
  disk:
    json_log_mb: 500
    sqlite_mb: 500
    pcap_mb: 1024

listeners:
  - id: ssh-bait
    proto: tcp
    bind: 0.0.0.0:2222
    mode: banner
    handler: raw
    banner: "SSH-2.0-OpenSSH_8.4p1 Debian-5\r\n"
    severity: high
    read_bytes: 1024
    read_timeout: 5s

  - id: http-bait
    proto: tcp
    bind: 0.0.0.0:8000
    mode: banner
    handler: raw
    banner: "HTTP/1.1 401 Unauthorized\r\nServer: nginx/1.18.0\r\nWWW-Authenticate: Basic realm=\"admin\"\r\nContent-Length: 0\r\n\r\n"
    severity: medium
    read_bytes: 4096
    read_timeout: 5s

  - id: drop-any-23
    proto: tcp
    bind: 0.0.0.0:2323
    mode: drop
    severity: medium

  - id: udp-5353
    proto: udp
    bind: 0.0.0.0:5353
    mode: drop
    severity: low
    read_bytes: 1500

dedup:
  default_window: 5m

allowlist:
  - 127.0.0.1/32
  - ::1/128

channels:
  - id: stdout
    type: stdout
    min_severity: low

  - id: jsonlog
    type: jsonlog
    min_severity: low

  # Uncomment and configure to enable outbound channels.
  #
  # - id: ops-webhook
  #   type: webhook
  #   url: https://hooks.example.com/tarpit
  #   hmac_secret_env: TARPIT_WEBHOOK_SECRET
  #   timeout: 5s
  #   min_severity: medium
  #   rate_limit_per_min: 60
  #
  # - id: ops-smtp
  #   type: smtp
  #   host: smtp.example.com
  #   port: 587
  #   starttls: true
  #   username_env: SMTP_USER
  #   password_env: SMTP_PASS
  #   from: "tarpit@example.com"
  #   to: ["secops@example.com"]
  #   min_severity: high
  #
  # - id: siem-syslog
  #   type: syslog
  #   network: tcp
  #   address: siem.example.internal:6514
  #   tag: tarpit-honeypot
  #   min_severity: low

routes:
  - match:
      severity: ">=low"
    channels: [stdout, jsonlog]
