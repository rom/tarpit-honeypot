sensor:
  name: ""                                  # blank = hostname
  data_dir: ./var
  # On Linux, after privileged setup the sensor will switch to this user/group.
  # Use with systemd AmbientCapabilities=CAP_NET_BIND_SERVICE to keep
  # privileged ports working. Leave blank when running unprivileged anyway.
  drop_user: ""
  drop_group: ""
  disk:
    json_log_mb: 500
    sqlite_mb: 500
    pcap_mb: 1024       # total cap for the captures directory
    capture_kb: 64      # per-session cap before truncation

ui:
  enabled: true
  bind: 127.0.0.1:8088
  # Non-loopback binds REQUIRE both tls_cert+tls_key AND auth_token_env.
  # tls_cert: /etc/tarpit-honeypot/ui.crt
  # tls_key:  /etc/tarpit-honeypot/ui.key
  # auth_token_env: TARPIT_UI_TOKEN

listeners:
  - id: ssh-bait
    proto: tcp
    bind: 0.0.0.0:2222
    mode: banner
    handler: ssh
    severity: high
    read_bytes: 1024
    read_timeout: 5s
    capture: true

  - id: modbus-bait
    proto: tcp
    bind: 0.0.0.0:502
    mode: banner
    handler: modbus
    severity: critical
    read_bytes: 260
    read_timeout: 5s
    capture: true

  - id: s7-bait
    proto: tcp
    bind: 0.0.0.0:102
    mode: banner
    handler: s7
    severity: critical
    read_bytes: 256
    read_timeout: 5s
    capture: true

  - id: iec104-bait
    proto: tcp
    bind: 0.0.0.0:2404
    mode: banner
    handler: iec104
    severity: critical
    read_bytes: 256
    read_timeout: 5s

  - id: mqtt-bait
    proto: tcp
    bind: 0.0.0.0:1883
    mode: banner
    handler: mqtt
    severity: high
    read_bytes: 1024
    read_timeout: 5s

  - id: http-bait
    proto: tcp
    bind: 0.0.0.0:8000
    mode: banner
    handler: http
    severity: medium
    read_bytes: 4096
    read_timeout: 5s

  - id: https-bait
    proto: tcp
    bind: 0.0.0.0:8443
    mode: banner
    handler: https
    severity: high
    read_bytes: 4096
    read_timeout: 5s
    https:
      hosts: ["honeypot.local"]

  - id: telnet-tarpit
    proto: tcp
    bind: 0.0.0.0:2323
    mode: tarpit
    severity: high
    tarpit:
      strategy: sticky
      max_per_source: 4
      max_total: 256

  - id: ftp-bait
    proto: tcp
    bind: 0.0.0.0:2121
    mode: banner
    handler: ftp
    severity: medium
    read_bytes: 256
    read_timeout: 10s

  - id: udp-5353
    proto: udp
    bind: 0.0.0.0:5353
    mode: drop
    severity: low
    read_bytes: 1500

canaries:
  - id: shared-creds
    path: ./var/canary/passwords.xlsx
    events: [write, remove, rename, chmod]
    severity: critical

correlate:
  port_scan:
    enabled: true
    distinct_ports: 5
    window: 30s
    severity: high
  brute_force:
    enabled: true
    attempts: 10
    window: 60s
    per_port: true
    severity: high

dedup:
  default_window: 5m

allowlist:
  - 127.0.0.1/32
  - ::1/128

channels:
  - id: stdout
    type: stdout
    min_severity: low

  - id: jsonlog
    type: jsonlog
    min_severity: low

  - id: sqlite
    type: sqlite
    min_severity: low

routes:
  - match:
      severity: ">=low"
    channels: [stdout, jsonlog, sqlite]
